  // 把一个槽位画成某枚棋子并摆到指定格（几何与 tools_work/three_boards2.html 一致）
  // ============================================================================
  // 走子补间（与 lua/levelScript.lua 的 ANIM 同一套时长/曲线）
  // ----------------------------------------------------------------------------
  // 【实现口径】渲染顺序是「先在目标格把它画好（renderPieces），再给这一枚挂一个
  // transform 把它整体挪回起点，然后每帧插值回 0」。
  // 关键点：**设起点位移与起动画必须在同一个 JS 任务内完成**，浏览器只合成一帧，
  // 所以点击的那一帧棋子就已经出现在起点并开始移动，不会先跳一下再动。
  //
  // 【为什么不用 CSS transition】transition 会让「即时定位」（复盘翻页、换档重绘、
  // 开局摆子）也变成滑动，新上场的棋子会从 (0,0) 滑入，出现鬼影。
  // 这里用 rAF 手动插值 + transform，且不声明任何 transition。
  //
  // 【性能】每帧只写「正在动的那一枚」的 3 个元素，其余 31 槽一动不动；
  // 呼吸效果全部交给 CSS animation，JS 每帧不碰任何高亮元素。
  // ============================================================================
  const MOVE_ANIMS = [];   // 正在跑的补间（通常 0 或 1 个）

  function slotEls(slot) { return [slot.outer, slot.inner, slot.glyph]; }

  // 写 transform。接近恒等时写空串，避免长期挂一个 translate(0,0) 影响合成层。
  function setSlotTransform(slot, dx, screenDy, scale) {
    const flat = Math.abs(dx) < 0.02 && Math.abs(screenDy) < 0.02 && Math.abs(scale - 1) < 0.0005;
    const tf = flat ? "" : "translate(" + dx.toFixed(2) + "px," + screenDy.toFixed(2) + "px) scale(" + scale.toFixed(4) + ")";
    for (const el of slotEls(slot)) el.style.transform = tf;
  }
  function clearSlotTransform(slot) { for (const el of slotEls(slot)) el.style.transform = ""; }

  // 起一段走子补间：slot 已经画在 toSq 上，这里把它挪回 fromSq 再往回插值
  function startMoveAnim(slot, fromSq, toSq) {
    if (!slot) return;
    const p0 = sqPos(fromSq), p1 = sqPos(toSq);
    const anim = {
      slot,
      dx0: p0.x - p1.x,          // left 方向差值
      dy0: p0.y - p1.y,          // bottom 方向差值（下方坐标）
      arc: L.cell * ANIM.MOVE_ARC,
      t: 0,
      phase: 0,                  // 0 = 位移中，1 = 落子回弹中
    };
    MOVE_ANIMS.push(anim);
    G.animBusy = true;
    // 立刻把起点位移写进去（同一任务内，浏览器不会先画一次终点）
    setSlotTransform(slot, anim.dx0, -anim.dy0, 1);
  }

  function clearMoveAnims() {
    while (MOVE_ANIMS.length) clearSlotTransform(MOVE_ANIMS.pop().slot);
    G.animBusy = false;
  }

  // 每帧推进；只在真的有补间时才进入这个函数体，没动画时零开销
  function animUpdate(dt) {
    if (MOVE_ANIMS.length === 0) return;
    for (let i = MOVE_ANIMS.length - 1; i >= 0; i--) {
      const a = MOVE_ANIMS[i];
      a.t += dt;
      if (a.phase === 0) {
        const raw = Math.min(1, a.t / ANIM.MOVE_DUR);
        const u = outCubic(raw);                  // 缓动与 Lua EASE.outCubic 同式
        const inv = 1 - u;
        // ① 位移：从起点线性插到 0（bottom 坐标 → 屏幕 y 要取负）
        // ② 弧线：抬升 MOVE_ARC 格，sin(π·raw) 在起终点都是 0，不会跳
        const dx = inv * a.dx0;
        const sdy = -inv * a.dy0 - a.arc * Math.sin(Math.PI * raw);
        setSlotTransform(a.slot, dx, sdy, 1);
        if (raw >= 1) {
          // 落子回弹：进入第二段，0.10s 内弹到 +7% 再回到 1.00。
          // 起点 scale 仍是 1.0（settleShape(0)=0），与位移段结尾严丝合缝。
          a.phase = 1; a.t = 0;
          setSlotTransform(a.slot, 0, 0, 1);
        }
      } else {
        const raw = Math.min(1, a.t / ANIM.SETTLE_DUR);
        // 1 + SETTLE_PEAK * settleShape(raw)：峰值正好 +7%，两端正好 0%
        const scale = 1 + ANIM.SETTLE_PEAK * settleShape(raw);
        setSlotTransform(a.slot, 0, 0, scale);
        if (raw >= 1) {
          clearSlotTransform(a.slot);
          MOVE_ANIMS.splice(i, 1);
          if (MOVE_ANIMS.length === 0) G.animBusy = false;
        }
      }
    }
  }

  function paintSlot(slot, p, bx, by, style) {
    const box = L.cell;
    const D = box * 0.88, ring = box * 0.048, innerD = D - ring * 2;
    const isWhite = p > 0;
    const fill = isWhite ? COLOR.WHITE_PIECE : COLOR.BLACK_PIECE;
    const outline = isWhite ? COLOR.WHITE_OUTLINE : COLOR.BLACK_OUTLINE;
    const ox = bx + (box - D) / 2, oy = by + (box - D) / 2;
    const ix = bx + (box - innerD) / 2, iy = by + (box - innerD) / 2;

    if (style === "glyph") {
      // 纯棋符：只有文本框，白方白字深描边、黑方深字浅描边
      slot.outer.classList.add("hidden");
      slot.inner.classList.add("hidden");
      slot.glyph.style.left = bx + "px";
      slot.glyph.style.bottom = by + "px";
      slot.glyph.style.width = box + "px";
      slot.glyph.style.height = box + "px";
      slot.glyph.style.fontSize = Math.floor(box * 0.80) + "px";
      slot.glyph.style.lineHeight = box + "px";
      slot.glyph.style.color = fill;
      slot.glyph.style.textShadow = "0 0 2px " + outline + ", 2px 2px 0 " + outline +
        ", -2px -2px 0 " + outline + ", 2px -2px 0 " + outline + ", -2px 2px 0 " + outline;
      slot.glyph.textContent = pieceGlyph(p);
      slot.glyph.classList.remove("hidden");
      return;
    }

    // 圆盘+棋符：外圈=描边色、内圈=棋子色，棋符画在圆盘上（字色=描边色，不加描边避免糊成一团）
    for (const [el, d, off, col] of [[slot.outer, D, [ox, oy], outline], [slot.inner, innerD, [ix, iy], fill]]) {
      el.style.left = off[0] + "px";
      el.style.bottom = off[1] + "px";
      el.style.width = d + "px";
      el.style.height = d + "px";
      el.style.background = col;
      el.classList.remove("hidden");
    }
    slot.glyph.style.left = ix + "px";
    slot.glyph.style.bottom = iy + "px";
    slot.glyph.style.width = innerD + "px";
    slot.glyph.style.height = innerD + "px";
    slot.glyph.style.fontSize = Math.floor(innerD * 0.80) + "px";
    slot.glyph.style.lineHeight = innerD + "px";
    slot.glyph.style.color = outline;
    slot.glyph.style.textShadow = "none";
    slot.glyph.textContent = pieceGlyph(p);
    slot.glyph.classList.remove("hidden");
  }

  function renderPieces() {
    // 【必须】任何一次全量重绘前先清掉在跑的补间：重绘会把棋子画回真实位置，
    // 若还留着上一段的 transform，棋子会被二次偏移到错误的位置。
    // 正常路径不受影响 —— applyMove 是「renderAll() 之后再 startMoveAnim()」，
    // 起动画时这里已经跑完了。
    clearMoveAnims();
    const style = (G.pieceStyle === "disc") ? "disc" : "glyph";
    // 复盘中按快照 FEN 重建局面来画，**不改 G.st**（退出复盘后原局面原样还在）
    const snapSt = reviewState();
    const board = snapSt ? snapSt.board : G.st.board;
    let used = 0;
    for (let sq = 0; sq < 64; sq++) {
      const p = board[sq];
      if (p === 0) continue;
      if (used >= UI.pieceSlots.length) break;
      const slot = UI.pieceSlots[used];
      used++;
      slot.sq = sq;
      const pos = sqPos(sq);
      paintSlot(slot, p, pos.x, pos.y, style);
    }
    // 多余槽位一律隐藏（播放期零创建零销毁）
    for (let i = used; i < UI.pieceSlots.length; i++) {
      const slot = UI.pieceSlots[i];
      slot.sq = -1;
      slot.outer.classList.add("hidden");
      slot.inner.classList.add("hidden");
      slot.glyph.classList.add("hidden");
    }
    UI.slotShown = used;
  }

  function renderCaptured() {
    const snap = reviewSnap();
    // 复盘中只显示「走到这一步为止」已吃的子
    const w = snap ? G.capturedWhite.slice(0, snap.capW) : G.capturedWhite;
    const b = snap ? G.capturedBlack.slice(0, snap.capB) : G.capturedBlack;
    UI.panel.capWhite.textContent = w.length ? "白失 " + w.join(" ") : "";
    UI.panel.capBlack.textContent = b.length ? "黑失 " + b.join(" ") : "";
  }

  function renderMoveLog() {
    const snap = reviewSnap();
    // 复盘中只显示到该步为止的走子记录（最后 6 行）
    const log = snap ? G.moveLog.slice(0, snap.idx) : G.moveLog;
    const n = log.length;
    const from = Math.max(0, n - MOVE_LOG_LINES);
    UI.panel.moveLog.textContent = log.slice(from).join("\n");
  }

  function renderLastMove() {
    const snap = reviewSnap();
    // 复盘中痕迹用快照的起终点；idx=0（开局）没有上一步，直接隐藏
    const lf = snap ? (snap.idx === 0 ? -1 : snap.from) : G.lastFrom;
    const lt = snap ? (snap.idx === 0 ? -1 : snap.to) : G.lastTo;
    if (lf >= 0 && lt >= 0) {
      const p1 = sqPos(lf), p2 = sqPos(lt);
      UI.lastMove[0].style.left = p1.x + "px"; UI.lastMove[0].style.bottom = p1.y + "px";
      UI.lastMove[1].style.left = p2.x + "px"; UI.lastMove[1].style.bottom = p2.y + "px";
      UI.lastMove[0].classList.remove("hidden");
      UI.lastMove[1].classList.remove("hidden");
    } else {
      UI.lastMove[0].classList.add("hidden");
      UI.lastMove[1].classList.add("hidden");
    }
  }

  function renderCheck() {
    const snap = reviewSnap();
    if (snap) {
      // 复盘中按快照局面判定将军；idx=0（开局）不判定
      UI.hint.textContent = snap.idx === 0 ? TEXT.REVIEW_START_HINT : snap.text;
      if (snap.idx === 0) { UI.checkHL.classList.add("hidden"); return; }
      const stSnap = reviewState();
      if (stSnap && CHESS_RULES.inCheck(stSnap, stSnap.turn)) {
        const ksq = CHESS_RULES.findKing(stSnap, stSnap.turn);
        if (ksq >= 0) {
          const p = sqPos(ksq);
          UI.checkHL.style.left = p.x + "px"; UI.checkHL.style.bottom = p.y + "px";
          UI.checkHL.classList.remove("hidden");
          return;
        }
      }
      UI.checkHL.classList.add("hidden");
      return;
    }
    if (G.over || !G.st) { UI.checkHL.classList.add("hidden"); return; }
    if (CHESS_RULES.inCheck(G.st, G.st.turn)) {
      const ksq = CHESS_RULES.findKing(G.st, G.st.turn);
      if (ksq >= 0) {
        const p = sqPos(ksq);
        UI.checkHL.style.left = p.x + "px"; UI.checkHL.style.bottom = p.y + "px";
        UI.checkHL.classList.remove("hidden");
        UI.hint.textContent = TEXT.CHECK;
      }
    } else {
      UI.checkHL.classList.add("hidden");
    }
  }

  function renderAll() {
    renderPieces(); renderCaptured(); renderMoveLog(); renderClocks(); renderTurn(); renderLastMove(); renderCheck();
  }

  // ---------- 高亮 ----------
  function clearHighlights() {
    for (let i = 0; i < UI.legalHL.length; i++) UI.legalHL[i].classList.add("hidden");
    for (let i = 0; i < UI.legalCapHL.length; i++) UI.legalCapHL[i].classList.add("hidden");
    UI.selHL.classList.add("hidden");
    G.selected = -1;
    G.legalTargets = new Map();
    G.legalMoves = [];
  }

  function selectSquare(sq) {
    const st = G.st;
    const p = st.board[sq];
    if (p === 0) return false;
    if ((p > 0) !== (st.turn === CHESS_RULES.WHITE)) return false;
    // 只有「确实存在联机对手」时才限制只操作自己那一方；
    // 单人打开（无对手）时允许操作双方，避免被锁死。
    if (!G.localMode && G.peerAlive) {
      const myTurn = (G.mySide === 1 && st.turn === CHESS_RULES.WHITE) || (G.mySide === 2 && st.turn === CHESS_RULES.BLACK);
      if (!myTurn) return false;
    }
    const moves = CHESS_RULES.legalMoves(st);
    const mine = [];
    const targets = new Map();
    for (const mv of moves) {
      if (mv.from === sq) {
        mine.push(mv);
        if (!targets.has(mv.to)) targets.set(mv.to, []);
        targets.get(mv.to).push(mv);
      }
    }
    if (mine.length === 0) return false;

    G.selected = sq; G.legalMoves = mine; G.legalTargets = targets;

    const p0 = sqPos(sq);
    UI.selHL.style.left = p0.x + "px"; UI.selHL.style.bottom = p0.y + "px";
    UI.selHL.classList.remove("hidden");

    // 落点分两种形态（与 Lua 一致）：空格 → 墨绿圆点；可吃子 → 红薄罩。
    // 两套池子各自计数，互不复用；选中的那一刻一次性写位置，之后不再逐帧动它们
    // （呼吸是 CSS animation 自动跑的，JS 每帧压根不碰这 28 个元素）。
    let idxDot = 0, idxCap = 0;
    for (const to of targets.keys()) {
      const pt = sqPos(to);
      if (st.board[to] !== 0) {
        if (idxCap >= UI.legalCapHL.length) continue;
        const el = UI.legalCapHL[idxCap++];
        el.style.left = pt.x + "px"; el.style.bottom = pt.y + "px";
        el.classList.remove("hidden");
      } else {
        if (idxDot >= UI.legalHL.length) continue;
        const el = UI.legalHL[idxDot++];
        el.style.left = pt.x + "px"; el.style.bottom = pt.y + "px";
        el.classList.remove("hidden");
      }
    }
    UI.hint.textContent = TEXT.HINT_SELECTED;
    SFX.play("select");
    return true;
  }

  // ---------- 走子 ----------
  function moveText(mv, side) {
    let s = (side === CHESS_RULES.WHITE ? "白 " : "黑 ") + CHESS_RULES.sqName(mv.from) + "→" + CHESS_RULES.sqName(mv.to);
    if (mv.promo) {
      s += { [CHESS_RULES.QUEEN]:"=Q", [CHESS_RULES.ROOK]:"=R", [CHESS_RULES.BISHOP]:"=B", [CHESS_RULES.KNIGHT]:"=N" }[mv.promo];
    }
    return s;
  }

  function applyMove(mv, opts) {
    opts = opts || {};
    const side = G.st.turn;
    let captured = G.st.board[mv.to];
    if (mv.ep) {
      const capSq = shiftSquare(mv.to, side === CHESS_RULES.WHITE ? -1 : 1, 0);
      captured = G.st.board[capSq];
    }
    CHESS_RULES.make(G.st, mv);

    if (captured !== 0) {
      // 被吃子记录统一用棋符（图片模式下也用它，便于面板窄空间显示）
      const glyph = pieceGlyph(captured);
      if (captured > 0) G.capturedWhite.push(glyph); else G.capturedBlack.push(glyph);
    }
    G.moveLog.push(moveText(mv, side));
    G.lastFrom = mv.from; G.lastTo = mv.to;
    if (side === CHESS_RULES.WHITE) G.clockWhite += INCREMENT_SEC; else G.clockBlack += INCREMENT_SEC;

    // 逐手快照：必须在加秒之后、renderAll 之前 push，
    // 这样快照里的 clockW/clockB 是该步加秒后的真实剩余秒数，
    // 且最后一步（含终局那一步）也一定进 history，复盘能走到真正的终局。
    pushHistorySnapshot(mv);

    const status = CHESS_RULES.gameStatus(G.st);
    if (status.over) {
      G.over = true;
      if (status.result === "1-0") {
        G.resultText = TEXT.RESULT_WHITE_WIN;
        G.resultSub = status.reason === "checkmate" ? TEXT.SUB_CHECKMATE : TEXT.SUB_RESIGN_BLACK;
      } else if (status.result === "0-1") {
        G.resultText = TEXT.RESULT_BLACK_WIN;
        G.resultSub = status.reason === "checkmate" ? TEXT.SUB_CHECKMATE : TEXT.SUB_RESIGN_WHITE;
      } else {
        G.resultText = TEXT.RESULT_DRAW_AGREED;
        if (status.reason === "stalemate") G.resultSub = TEXT.SUB_STALEMATE;
        else if (status.reason === "fifty") G.resultSub = TEXT.SUB_FIFTY;
        else if (status.reason === "threefold") G.resultSub = TEXT.SUB_THREEFOLD;
        else if (status.reason === "insufficient") G.resultSub = TEXT.SUB_INSUFFICIENT;
        else G.resultSub = TEXT.SUB_DRAW_AGREED;
      }
      showResult();
    }
    clearHighlights();
    renderAll();
    // 走子补间：renderAll 已经把棋子画到目标格，这里把「刚走的那一枚」挪回起点再插值回来。
    // 【顺序纪律】必须在 renderAll 之后、同一帧内完成 —— 否则浏览器先画一帧终点位置，
    // 下一帧才起动画，看起来就是「跳一下再动」。
    if (!opts.noAnim) {
      const slot = UI.pieceSlots.find((s) => s.sq === mv.to);
      // 补间一挂上就开始写 transform（在 startMoveAnim 内部同步完成），
      // 主循环的 animUpdate 会在下一帧接着插值。
      if (slot) startMoveAnim(slot, mv.from, mv.to);
    }
    // 音效：吃子优先于走子（同一手只响一声）
    if (opts.fromRemote) { /* 远端同步的走子不重复出声，避免双窗口叠加 */
    } else if (captured !== 0) SFX.play("capture");
    else SFX.play("move");
    // 将军 / 终局的音覆盖走子音（它们是「更重要的信息」，延后一点起）
    const nowInCheck = !G.over && CHESS_RULES.inCheck(G.st, G.st.turn);
    if (nowInCheck) SFX.play("check");
    if (G.over) SFX.play("over");
    if (!opts.fromRemote) netSendMove(mv);
  }

  function shiftSquare(sq, dr, df) {
    const r = (sq >> 3) + dr, f = (sq & 7) + df;
    if (r < 0 || r > 7 || f < 0 || f > 7) return -1;
    return r * 8 + f;
  }

  function tryMove(toSq) {
    if (G.selected < 0) return false;
    const cands = G.legalTargets.get(toSq);
    if (!cands || cands.length === 0) return false;
    if (cands.length > 1 && cands[0].promo) {
      G.pendingPromo = cands;
      showParts(UI.promo.parts, true);
      setBoardInput(false);
      return true;
    }
    applyMove(cands[0]);
    return true;
  }

  function onPromoChosen(promoPiece) {
    if (!G.pendingPromo) return;
    let chosen = null;
    for (const mv of G.pendingPromo) if (mv.promo === promoPiece) { chosen = mv; break; }
    G.pendingPromo = null;
    showParts(UI.promo.parts, false);
    setBoardInput(true);
    if (chosen) {
      SFX.play("promote");   // 升变琶音（与 Lua 升变音同位）
      applyMove(chosen);
    }
  }

  function setBoardInput(on) {
    for (let sq = 0; sq < 64; sq++) {
      UI.hitAreas[sq].style.pointerEvents = on ? "auto" : "none";
    }
  }

  function onSquareClicked(sq) {
    // 复盘只看不点：这里是第一道闸（第二道闸是 64 个命中区的 pointerEvents=none）
    if (G.review) return;
    if (G.over || G.pendingPromo) return;
    // 注意：这里**不**放点击音 —— 点棋子出「选中音」、点空/非法格什么都不响，
    // 见 Lua 侧同口径（点击音只绑在按钮上，棋盘交互靠选中/走子音反馈）。
    if (G.selected >= 0 && G.legalTargets.has(sq)) { tryMove(sq); return; }
    if (G.selected === sq) { clearHighlights(); UI.hint.textContent = TEXT.HINT_OPENING; return; }
    if (!selectSquare(sq)) { clearHighlights(); UI.hint.textContent = TEXT.HINT_OPENING; }
  }

  // ---------- 逐手复盘（快照写入 / 面板切换 / 翻页 / 进出） ----------
  // 快照写入：applyMove 末尾调用一次，把「这一步走完后的完整可视状态」定存。
  function pushHistorySnapshot(mv) {
    G.history.push({
      fen: CHESS_RULES.fenOf(G.st),
      text: G.moveLog[G.moveLog.length - 1],   // 与本步 moveLog 最后一项完全相同
      idx: G.history.length,                   // 这是第几步（history[0] 的 idx=0）
      from: mv.from, to: mv.to,
      capW: G.capturedWhite.length, capB: G.capturedBlack.length,
      clockW: G.clockWhite, clockB: G.clockBlack,   // 已含本步加秒
    });
  }

  // 面板两套按钮的显隐（正常四键 / 复盘四键）。第三行单按钮常驻，只换文案。
  function applyPanelMode() {
    const inReview = !!G.review;
    showParts(UI.panel.normalParts, !inReview);
    showParts(UI.panel.reviewParts, inReview);
    UI.panel.btnReview.textContent = inReview ? TEXT.BTN_REVIEW_EXIT : TEXT.BTN_REVIEW_HISTORY;
  }

  // 复盘翻页：delta 相对移动 / idx 绝对定位；到边界就原样不动，不报错
  function reviewGoto(idx) {
    if (!G.review) return false;
    const maxIdx = G.history.length - 1;
    let want = idx;
    if (want < 0) want = 0;
    if (want > maxIdx) want = maxIdx;
    if (want === G.review.idx) return false;   // 已在边界：无效果
    G.review.idx = want;
    renderAll();
    return true;
  }
  function reviewStep(delta) {
    if (!G.review) return false;
    return reviewGoto(G.review.idx + delta);
  }

  // 进入复盘：停在最后一步。空态（一步没走）直接给提示并返回，不进入。
  // 对局中进入时不清 G.over、不动 G.st / G.moveLog —— 退出后原局面接着下。
  function enterReview() {
    if (G.history.length <= 1) {
      UI.hint.textContent = TEXT.REVIEW_EMPTY;
      return false;
    }
    // 升变选择 / 求和确认弹窗若正开着，先收起（退出复盘时按状态复原），
    // 否则它们会叠在复盘画面上，且退出时棋盘会被错误解锁。
    G.reviewRestoreModal = {
      promo: !UI.promo.bg.classList.contains("hidden"),
      draw: !UI.drawDlg.bg.classList.contains("hidden"),
    };
    showParts(UI.promo.parts, false);
    showParts(UI.drawDlg.parts, false);

    G.review = { idx: G.history.length - 1 };
    hideResult();            // 结算弹窗让位给复盘（退出时按 G.over 重新弹回）
    clearHighlights();
    setBoardInput(false);    // 64 个命中区彻底不可点（不是只靠 onSquareClicked 里的 return）
    applyPanelMode();
    renderAll();             // renderCheck 里会按快照写提示条（idx 0 → REVIEW_START_HINT）
    return true;
  }

  // 退出复盘：回到原局面。对局已结束 → 重新弹结算；否则恢复棋盘交互。
  // 若进入复盘时升变/求和弹窗开着，按原样复原并保持棋盘锁定。
  function exitReview() {
    if (!G.review) return false;
    G.review = null;
    const restore = G.reviewRestoreModal || { promo: false, draw: false };
    G.reviewRestoreModal = null;
    applyPanelMode();
    if (restore.promo && G.pendingPromo) {
      showParts(UI.promo.parts, true);
      setBoardInput(false);
    } else if (restore.draw) {
      showParts(UI.drawDlg.parts, true);
      setBoardInput(false);
    } else if (G.over) {
      setBoardInput(false);
      showResult();
    } else {
      setBoardInput(true);
      UI.hint.textContent = TEXT.HINT_OPENING;
    }
    renderAll();
    return true;
  }

  // 两个入口共用：结算弹窗「复盘」与面板「看历史」。按钮文案决定进还是出。
  function onReviewEntryClicked() {
    if (G.review) { exitReview(); return; }
    enterReview();
  }

  // ---------- 结算 / 按钮 ----------
  function showResult() {
    UI.result.title.textContent = G.resultText;
    UI.result.sub.textContent = G.resultSub;
    showParts(UI.result.parts, true);
    setBoardInput(false);
  }
  function hideResult() { showParts(UI.result.parts, false); }

  function newGame(opts) {
    opts = opts || {};
    G.st = CHESS_RULES.parseFen(START_FEN);
    G.over = false; G.resultText = ""; G.resultSub = "";
    G.clockWhite = INITIAL_TIME_SEC; G.clockBlack = INITIAL_TIME_SEC;
    G.moveLog = []; G.capturedWhite = []; G.capturedBlack = [];
    G.lastFrom = -1; G.lastTo = -1;
    G.pendingPromo = null; G.drawCooldown = [0, 0]; G.drawPendingFrom = -1;
    // 【复盘】新开一局清空历史，只留开局快照（history[0] 恒为开局）
    G.history = [makeStartSnapshot()];
    G.review = null;
    G.reviewRestoreModal = null;
    clearHighlights();
    hideResult();
    showParts(UI.promo.parts, false);
    showParts(UI.drawDlg.parts, false);
    setBoardInput(true);
    applyPanelMode();
    UI.hint.textContent = TEXT.HINT_OPENING;
    renderAll();
    if (!opts.fromRemote) netSendEvent(1, 0, 0, 0, "");
  }

  function doResign() {
    if (G.over) return;
    G.over = true;
    const resignSide = G.st.turn === CHESS_RULES.WHITE ? 1 : 2;
    if (G.st.turn === CHESS_RULES.WHITE) {
      G.resultText = TEXT.RESULT_BLACK_WIN; G.resultSub = TEXT.SUB_RESIGN_WHITE;
    } else {
      G.resultText = TEXT.RESULT_WHITE_WIN; G.resultSub = TEXT.SUB_RESIGN_BLACK;
    }
    showResult();
    SFX.play("over");   // 结束三音收尾（与 Lua 的结束音同位）
    netSendEvent(2, resignSide - 1, 0, 0, "");
  }

  function doDrawRequest() {
    if (G.over) return;
    const sideIdx = G.st.turn === CHESS_RULES.WHITE ? 0 : 1;
    if (G.drawCooldown[sideIdx] > 0) { UI.hint.textContent = TEXT.BTN_DRAW_USED; return; }
    G.drawCooldown[sideIdx] = DRAW_COOLDOWN_SEC;
    if (G.localMode) {
      showParts(UI.drawDlg.parts, true);
      setBoardInput(false);
    } else {
      netSendEvent(3, sideIdx, 0, 0, "");
      UI.hint.textContent = "已发出和棋请求";
    }
  }

  function onDrawAccepted() {
    showParts(UI.drawDlg.parts, false);
    setBoardInput(true);
    G.over = true;
    G.resultText = TEXT.RESULT_DRAW_AGREED; G.resultSub = TEXT.SUB_DRAW_AGREED;
    showResult();
    SFX.play("over");
    if (G.localMode) netSendEvent(4, 0, 0, 0, "");
  }

  function onDrawRejected() {
    showParts(UI.drawDlg.parts, false);
    setBoardInput(true);
    UI.hint.textContent = "对方拒绝和棋，继续对局";
    if (G.localMode) netSendEvent(7, 0, 0, 0, "");
  }

  function toggleLocalMode() {
    G.localMode = !G.localMode;
    UI.panel.btnLocal.textContent = G.localMode ? "联机" : TEXT.BTN_LOCAL;
    UI.hint.textContent = G.localMode ? "已切换到同屏轮流" : TEXT.TURN_WHITE;
    if (G.localMode) netBroadcast({ type: "mode", local: true });
  }

  // ---------- 联机模拟（BroadcastChannel + localStorage 双通道） ----------
  // 说明：这是**同机双窗口同步的模拟**，用来演示「两端局面实时一致」。
  // 真机上对应 game.ServerSignal / RegisterServerSignalHandler，服务端节点图负责广播。
  const CHANNEL_NAME = "chess_biji_demo_sync_v1";
  const LS_KEY = "chess_biji_demo_state_v1";
  const INSTANCE_ID = Math.random().toString(36).slice(2, 10);
  let channel = null;
  let netReady = false;

  function initNet() {
    try {
      if (typeof BroadcastChannel !== "undefined") {
        channel = new BroadcastChannel(CHANNEL_NAME);
        channel.onmessage = (ev) => onNetMessage(ev.data);
        netReady = true;
      }
    } catch (e) { netReady = false; }
    window.addEventListener("storage", (ev) => {
      if (ev.key === LS_KEY && ev.newValue) {
        try { onNetMessage(JSON.parse(ev.newValue)); } catch (e) {}
      }
    });
    // 身份分配：先打开的是白方，后打开的是黑方（用 localStorage 里的占用标记）
    // 【降级规则】若 30 秒内没有另一个实例在活跃（对手已关闭 / 本来就只有一个人），
    // 则本端可操作双方（等价于同屏），否则单人玩家会被锁死成黑方、什么都点不了。
    try {
      const occupied = JSON.parse(localStorage.getItem("chess_biji_demo_seat_v1") || "null");
      const now = Date.now();
      if (!occupied || now - occupied.at > 30000) {
        localStorage.setItem("chess_biji_demo_seat_v1", JSON.stringify({ id: INSTANCE_ID, at: now }));
        G.mySide = 1;
        G.peerAlive = false;
      } else if (occupied.id === INSTANCE_ID) {
        G.mySide = 1;
        G.peerAlive = false;
      } else {
        G.mySide = 2;
        G.peerAlive = true;   // 确实有另一个实例在活跃
      }
    } catch (e) { G.mySide = 1; G.peerAlive = false; }
    UI.hint.textContent = (!G.peerAlive) ? "同屏轮流：两个人轮流点这块棋盘" : (G.mySide === 1 ? "你是白方" : "你是黑方");
    setInterval(() => {
      try {
        const occ = JSON.parse(localStorage.getItem("chess_biji_demo_seat_v1") || "null");
        if (occ && occ.id === INSTANCE_ID) {
          occ.at = Date.now();
          localStorage.setItem("chess_biji_demo_seat_v1", JSON.stringify(occ));
        }
        // 对手是否还活着：占用标记不是自己、且 30 秒内更新过
        G.peerAlive = !!(occ && occ.id !== INSTANCE_ID && (Date.now() - occ.at) <= 30000);
      } catch (e) {}
    }, 5000);
  }

  function netBroadcast(msg) {
    msg._from = INSTANCE_ID;
    if (channel) { try { channel.postMessage(msg); } catch (e) {} }
    try { localStorage.setItem(LS_KEY, JSON.stringify(msg)); } catch (e) {}
  }

  // 信号格式与 lua 第 9 区一致：{eventType, a, b, c, fen}
  function netSendEvent(eventType, a, b, c, fen) {
    if (!netReady) return;
    netBroadcast({ sig: true, eventType, a: a || 0, b: b || 0, c: c || 0, fen: fen || "" });
  }
  function netSendMove(mv) {
    const promoCode = mv.promo === CHESS_RULES.QUEEN ? 1 : mv.promo === CHESS_RULES.ROOK ? 2 :
                      mv.promo === CHESS_RULES.BISHOP ? 3 : mv.promo === CHESS_RULES.KNIGHT ? 4 : 0;
    netSendEvent(0, mv.from, mv.to, promoCode, CHESS_RULES.fenOf(G.st));
  }

  let lastAppliedFen = "";
  function onNetMessage(msg) {
    if (!msg || msg._from === INSTANCE_ID) return;
    if (msg.type === "mode" && msg.local) { G.localMode = true; return; }
    if (!msg.sig) return;
    const { eventType, a, b, c, fen } = msg;

    if (eventType === 0) {
      // 走子：以广播 fen 为准重建，避免两端分叉
      if (fen) {
        if (fen === lastAppliedFen) return;
        lastAppliedFen = fen;
        G.st = CHESS_RULES.parseFen(fen);
        G.lastFrom = a; G.lastTo = b;
        renderAll();
        clearHighlights();
        return;
      }
      // 没有 fen 时按走法重算
      const wantPromo = { 0: null, 1: CHESS_RULES.QUEEN, 2: CHESS_RULES.ROOK, 3: CHESS_RULES.BISHOP, 4: CHESS_RULES.KNIGHT }[c] || null;
      const cands = [];
      for (const mv of CHESS_RULES.legalMoves(G.st)) {
        if (mv.from === a && mv.to === b && ((wantPromo === null && !mv.promo) || (wantPromo !== null && mv.promo === wantPromo))) cands.push(mv);
      }
      if (cands.length) applyMove(cands[0], { fromRemote: true });
    } else if (eventType === 1) {
      newGame({ fromRemote: true });
    } else if (eventType === 2) {
      G.over = true;
      if (a === 0) { G.resultText = TEXT.RESULT_BLACK_WIN; G.resultSub = TEXT.SUB_RESIGN_WHITE; }
      else { G.resultText = TEXT.RESULT_WHITE_WIN; G.resultSub = TEXT.SUB_RESIGN_BLACK; }
      showResult();
    } else if (eventType === 3) {
      showParts(UI.drawDlg.parts, true);
      setBoardInput(false);
    } else if (eventType === 4) {
      showParts(UI.drawDlg.parts, false);
      G.over = true;
      G.resultText = TEXT.RESULT_DRAW_AGREED; G.resultSub = TEXT.SUB_DRAW_AGREED;
      showResult();
    } else if (eventType === 7) {
      UI.hint.textContent = "对方拒绝和棋，继续对局";
    }
  }

  // ---------- 主循环（棋钟） ----------
  // 棋钟推进抽成独立函数：① 复盘期间必须整段跳过（对局中看历史时棋钟要停）
  // ② 自检可以直接喂一个大 dt 验证「复盘中棋钟不变」，不用等真实时间流逝。
  function tickClock(dt) {
    if (G.review) return;                 // 【复盘】棋钟停摆：复盘是只读回放，不消耗时间
    if (G.st && !G.over) {
      if (G.st.turn === CHESS_RULES.WHITE) {
        G.clockWhite -= dt;
        if (G.clockWhite <= 0) { G.clockWhite = 0; G.over = true; G.resultText = TEXT.RESULT_BLACK_WIN; G.resultSub = TEXT.SUB_TIMEOUT_WHITE; showResult(); SFX.play("over"); }
      } else {
        G.clockBlack -= dt;
        if (G.clockBlack <= 0) { G.clockBlack = 0; G.over = true; G.resultText = TEXT.RESULT_WHITE_WIN; G.resultSub = TEXT.SUB_TIMEOUT_BLACK; showResult(); SFX.play("over"); }
      }
    }
  }

  let lastFrame = performance.now();
  function tick(now) {
    const dt = Math.min(0.25, (now - lastFrame) / 1000);
    lastFrame = now;
    tickClock(dt);
    for (let i = 0; i < 2; i++) if (G.drawCooldown[i] > 0) G.drawCooldown[i] = Math.max(0, G.drawCooldown[i] - dt);
    G.clockTimer += dt;
    if (G.clockTimer >= CLOCK_REFRESH_SEC) { G.clockTimer = 0; renderClocks(); }
    // 走子补间：只在真的有动画时才进入函数体（内部第一行就 return，无动画零开销）。
    // 呼吸（选中格 / 落点）全部走 CSS animation，主循环不碰这些元素。
    animUpdate(dt);
    requestAnimationFrame(tick);
  }

  // ---------- 视口缩放 ----------
  let scaleNow = 1;
  function fitStage() {
    const stage = document.getElementById("stage");
    const vw = window.innerWidth, vh = window.innerHeight;
    const scale = Math.min(vw / BASE_W, vh / BASE_H);
    scaleNow = scale;
    // 必须保留 translate(-50%,-50%)：它把舞台中心锚在视口中心，
    // 只写 scale 会让舞台左上角贴在视口左上角，右侧与下侧内容被切掉。
    stage.style.transform = "translate(-50%, -50%) scale(" + scale + ")";
  }

  // ---------- 量测探针（默认关闭，?measure=1） ----------
  function installMeasure() {
    const params = new URLSearchParams(location.search);
    if (!params.has("measure")) return;
    window.__measure = function () {
      // 【量测口径】stage 被 transform:scale 缩放，getBoundingClientRect 返回的是缩放后尺寸。
      // 因此必须除以「设计基准宽高」×「当前缩放值」，才能得到设计基准下的百分比。
      // 直接用 rect 宽高做分母会把所有百分比算错（曾导致面板 left 显示 98.7%，误判为出界）。
      const stageEl = document.getElementById("stage");
      const rect = stageEl.getBoundingClientRect();
      const curScale = scaleNow || 1;
      const baseLeft = rect.left, baseTop = rect.top;
      const baseW = BASE_W * curScale, baseH = BASE_H * curScale;
      const out = [];
      document.querySelectorAll("[data-anchor-id]").forEach(function (el) {
        const r = el.getBoundingClientRect();
        // 初始隐藏的元素尺寸为 0，单独标记，不参与越界判定
        const hidden = (r.width === 0 || r.height === 0);
        out.push({
          id: el.getAttribute("data-anchor-id"),
          hidden: hidden,
          leftPct: +((r.left - baseLeft) / baseW * 100).toFixed(3),
          topPct: +((r.top - baseTop) / baseH * 100).toFixed(3),
          wPct: +(r.width / baseW * 100).toFixed(3),
          hPct: +(r.height / baseH * 100).toFixed(3),
          cxPct: +((r.left + r.width / 2 - baseLeft) / baseW * 100).toFixed(3),
          cyPct: +((r.top + r.height / 2 - baseTop) / baseH * 100).toFixed(3),
        });
      });
      document.title = "MEASURE_READY";
      console.log("MEASURE_RESULT " + JSON.stringify(out));
      // 自动化量测：把结果连同缩放信息 POST 回本地服务（仅在带 reportPort 时）
      const rp = new URLSearchParams(location.search).get("reportPort");
      if (rp) {
        try {
          fetch("http://127.0.0.1:" + rp + "/measure", {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              items: out,
              scale: scaleNow,
              contentW: document.getElementById("stage").getBoundingClientRect().width,
              contentH: document.getElementById("stage").getBoundingClientRect().height,
              viewportW: window.innerWidth, viewportH: window.innerHeight,
            }),
          }).catch(() => {});
        } catch (e) {}
      }
      return JSON.stringify(out, null, 2);
    };
    window.addEventListener("load", () => setTimeout(() => window.__measure(), 300));
  }

  // ---------- 自检（?selftest=1） ----------
  function installSelfTest() {
    window.__selfTest = function () {
      const checks = [];
      const add = (name, pass, detail) => checks.push({ name, pass, detail: detail || "" });

      // 0 启动瞬间不得有任何弹窗（放在最前，此时尚未调用过 newGame/hideResult，
      //   反映的是 boot 后的真实初始画面）
      const startupDialogVisible = [
        ...UI.result.parts, ...UI.promo.parts, ...UI.drawDlg.parts
      ].some((el) => el && !el.classList.contains("hidden"));
      add("no_dialog_on_boot", !startupDialogVisible);

      // 1 棋盘 64 格存在且颜色正确（a1 深格）
      let sqOk = true;
      for (let sq = 0; sq < 64; sq++) {
        const el = UI.squares[sq];
        if (!el) { sqOk = false; break; }
        const isDark = (((sq >> 3) + (sq & 7)) % 2 === 0);
        const want = isDark ? COLOR.SQ_DARK : COLOR.SQ_LIGHT;
        if (el.style.background.replace(/\s/g, "") !== want.replace(/\s/g, "")) { sqOk = false; break; }
      }
      add("board_64_squares_a1_dark", sqOk);

      // 2 初始摆位
      const startSt = CHESS_RULES.parseFen(START_FEN);
      let placementOk = true;
      for (let sq = 0; sq < 64; sq++) {
        if (startSt.board[sq] !== G.st.board[sq]) { placementOk = false; break; }
      }
      add("initial_placement", placementOk);

      // 3 perft 深度 1-2
      let perftOk = true, perftDetail = "";
      for (const c of PERFT_CASES) {
        const st = CHESS_RULES.parseFen(c.fen);
        const d1 = CHESS_RULES.perft(st, 1);
        if (d1 !== c.d1) { perftOk = false; perftDetail += `${c.name} d1 got=${d1} exp=${c.d1}; `; }
        const d2 = CHESS_RULES.perft(CHESS_RULES.parseFen(c.fen), 2);
        if (d2 !== c.d2) { perftOk = false; perftDetail += `${c.name} d2 got=${d2} exp=${c.d2}; `; }
      }
      add("perft_d1_d2", perftOk, perftDetail);

      // 4 点 e2 再点 e4 → 兵走到 e4
      newGame({ fromRemote: true });
      const e2 = 12, e4 = 28;
      selectSquare(e2);
      const moved = tryMove(e4);
      const afterE4 = G.st.board[e4];
      add("click_e2_e4_moves_pawn", moved && afterE4 === CHESS_RULES.PAWN, "board[e4]=" + afterE4);

      // 5 点 e2 再点 e5 → 非法，不生效
      newGame({ fromRemote: true });
      selectSquare(e2);
      const bad = tryMove(36);   // e5
      add("click_e2_e5_rejected", !bad && G.st.board[36] === 0, "board[e5]=" + G.st.board[36]);

      // 6 吃过路兵
      newGame({ fromRemote: true });
      G.st = CHESS_RULES.parseFen("4k3/8/8/3pP3/8/8/8/4K3 w - d6 0 1");
      renderAll();
      const epMove = CHESS_RULES.findMove(G.st, "e5d6");
      add("en_passant_available", epMove !== null && epMove.ep === true, "uci=e5d6");

      // 7 易位
      newGame({ fromRemote: true });
      G.st = CHESS_RULES.parseFen("r3k2r/8/8/8/8/8/8/R3K2R w KQkq - 0 1");
      renderAll();
      const castleMove = CHESS_RULES.findMove(G.st, "e1g1");
      add("castling_available", castleMove !== null && castleMove.castle === true, "uci=e1g1");

      // 8 升变
      newGame({ fromRemote: true });
      G.st = CHESS_RULES.parseFen("8/P7/8/8/8/8/7k/4K3 w - - 0 1");
      renderAll();
      // a7 = rank6,file0 = 48；a8 = rank7,file0 = 56
      const promos = CHESS_RULES.legalMoves(G.st).filter(mv => mv.from === 48 && mv.to === 56);
      add("promotion_4_options", promos.length === 4, "count=" + promos.length);

      // 9 一步将死
      newGame({ fromRemote: true });
      G.st = CHESS_RULES.parseFen("rnb1kbnr/pppp1ppp/8/4p3/6Pq/5P2/PPPPP2P/RNBQKBNR w KQkq - 1 3");
      renderAll();
      const st9 = CHESS_RULES.gameStatus(G.st);
      add("checkmate_detected", st9.over && st9.reason === "checkmate", "reason=" + st9.reason);

      // 10 逼和
      G.st = CHESS_RULES.parseFen("7k/5Q2/6K1/8/8/8/8/8 b - - 0 1");
      renderAll();
      const st10 = CHESS_RULES.gameStatus(G.st);
      add("stalemate_detected", st10.over && st10.reason === "stalemate", "reason=" + st10.reason);

      // 11 棋钟：走一步后走子方 +10
      newGame({ fromRemote: true });
      const beforeW = G.clockWhite;
      selectSquare(12); tryMove(28);
      add("clock_increment", G.clockWhite === beforeW + INCREMENT_SEC, "delta=" + (G.clockWhite - beforeW));

      // 12 重开复位
      newGame({ fromRemote: true });
      add("newgame_resets_clock", G.clockWhite === INITIAL_TIME_SEC && G.moveLog.length === 0,
          "clock=" + G.clockWhite + " log=" + G.moveLog.length);

      // 13 联机模拟：收到走子消息 → 棋盘更新
      newGame({ fromRemote: true });
      const fenBefore = CHESS_RULES.fenOf(G.st);
      onNetMessage({ _from: "other", sig: true, eventType: 0, a: 12, b: 28, c: 0,
                     fen: "rnbqkbnr/pppppppp/8/8/4P3/8/PPPP1PPP/RNBQKBNR b KQkq - 0 1" });
      add("net_receive_updates_board", CHESS_RULES.fenOf(G.st) !== fenBefore && G.st.board[28] === CHESS_RULES.PAWN);

      // 14 无调试显示（默认状态）
      const debugVisible = document.getElementById("debugLayer").classList.contains("on");
      add("no_debug_by_default", !debugVisible);

      // 16 棋盘格数 = 64，点击区 = 64
      add("hit_areas_64", UI.hitAreas.filter(Boolean).length === 64, "n=" + UI.hitAreas.filter(Boolean).length);

      // 17 棋子槽位 32 个（棋盘同时最多 32 枚棋子在场）
      const slotN = UI.pieceSlots.filter(Boolean).length;
      add("piece_slots_32", slotN === 32, "n=" + slotN);

      // 18 两档样式都能把全部棋子画出来（切档只改显隐，控件不重建）
      let styleOk = true, styleDetail = "";
      const wantShown = G.st.board.filter((v) => v !== 0).length;
      for (const st of ["disc", "glyph"]) {
        G.pieceStyle = st;
        renderPieces();
        const shown = UI.pieceSlots.filter((s) => !s.glyph.classList.contains("hidden")).length;
        if (shown !== wantShown) { styleOk = false; styleDetail += st + " " + shown + "/" + wantShown + "; "; }
      }
      add("piece_style_two_tiers", styleOk, styleDetail);
      G.pieceStyle = "disc";
      renderPieces();

      // 19 复盘快照：走 2 步后 history 应有 3 项（1 开局 + 2 步）
      newGame({ fromRemote: true });
      // 【必须】自检要在浏览器里跑，initNet 可能已把本端判成黑方（peerAlive=true）。
      // 那样第 2 步（黑方 e7→e5）会被 selectSquare 的「只许操作自己一方」拦住。
      // 这里显式回到单机口径，让两步都能走（与正常单机打开时一致）。
      G.peerAlive = false; G.mySide = 1;
      selectSquare(12); tryMove(28);    // e2→e4
      selectSquare(52); tryMove(36);    // e7→e5
      add("review_history_built", G.history.length === 3, "len=" + G.history.length);
      // 快照内容与实时状态一致（最后一项 = 当前局面）
      const lastSnap = G.history[G.history.length - 1];
      const snapFenOk = lastSnap && lastSnap.fen === CHESS_RULES.fenOf(G.st)
        && lastSnap.text === G.moveLog[G.moveLog.length - 1]
        && lastSnap.idx === G.moveLog.length
        && lastSnap.from === G.lastFrom && lastSnap.to === G.lastTo;
      add("review_snapshot_matches_state", !!snapFenOk);

      // 20 复盘翻页：prev/next 改变 idx 且不越界；边界点击无效果
      const entered = enterReview();
      const maxIdx = G.history.length - 1;
      let navOk = entered && G.review && G.review.idx === maxIdx;   // 进入即停在最后一步
      let navDetail = "enter idx=" + (G.review ? G.review.idx : "null") + " max=" + maxIdx + "; ";
      if (navOk) {
        const i0 = G.review.idx;
        reviewStep(-1);                       // 回到上一步
        if (G.review.idx !== i0 - 1) { navOk = false; navDetail += "prev got=" + G.review.idx + "; "; }
        reviewGoto(0);                        // 绝对跳到开局
        if (G.review.idx !== 0) { navOk = false; navDetail += "goto0 got=" + G.review.idx + "; "; }
        reviewStep(-1);                       // 已在开局：再往前应无效果（仍是 0）
        if (G.review.idx !== 0) { navOk = false; navDetail += "prev_at_start got=" + G.review.idx + "; "; }
        reviewGoto(maxIdx);                   // 跳回终局
        if (G.review.idx !== maxIdx) { navOk = false; navDetail += "gotoEnd got=" + G.review.idx + "; "; }
        reviewStep(+1);                       // 已在终局：再往后应无效果（仍是 max）
        if (G.review.idx !== maxIdx) { navOk = false; navDetail += "next_at_end got=" + G.review.idx + "; "; }
      }
      add("review_prev_next", navOk, navDetail);

      // 21 复盘中棋钟不变（复盘只读快照，绝不能扣 G.clockWhite/G.clockBlack）
      let clockOk = false, clockDetail = "";
      if (G.review) {
        const cw0 = G.clockWhite, cb0 = G.clockBlack;
        // 走真实主循环用的同一段代码：喂 480 帧 × 0.25s = 120 秒虚拟时间
        for (let i = 0; i < 480; i++) tickClock(0.25);
        clockOk = (G.clockWhite === cw0) && (G.clockBlack === cb0);
        clockDetail = "w " + cw0 + "→" + G.clockWhite + " b " + cb0 + "→" + G.clockBlack;
      }
      add("review_no_clock_in_review", clockOk, clockDetail);

      // 退出复盘回到原局面（对局中看历史不改变局面）
      exitReview();
      add("review_exit_restores_board", G.review === null && CHESS_RULES.fenOf(G.st) === lastSnap.fen);

      // 空态：一步没走时进复盘应被拒绝并给提示
      newGame({ fromRemote: true });
      const emptyEntered = enterReview();
      add("review_empty_rejected", emptyEntered === false && G.review === null
          && UI.hint.textContent === TEXT.REVIEW_EMPTY, "hint=" + UI.hint.textContent);

      // 复位到干净开局
      newGame({ fromRemote: true });

      const ok = checks.every(c => c.pass);
      return { ok, checks };
    };
  }

  // ---------- 调试层（?debug=1） ----------
  function installDebug() {
    const params = new URLSearchParams(location.search);
    if (!params.has("debug")) return;
    const layer = document.getElementById("debugLayer");
    layer.classList.add("on");
    document.querySelectorAll("[data-anchor-id]").forEach((el) => {
      const r = el.getBoundingClientRect();
      const s = document.getElementById("stage").getBoundingClientRect();
      const scale = s.width / BASE_W;
      const box = document.createElement("div");
      box.className = "anchor-line";
      box.style.left = ((r.left - s.left) / scale) + "px";
      box.style.bottom = ((s.bottom - r.bottom) / scale) + "px";
      box.style.width = (r.width / scale) + "px";
      box.style.height = (r.height / scale) + "px";
      layer.appendChild(box);
    });
  }

  // ---------- 启动 ----------
  function boot() {
    // 【必须放在最前】params 被后面多处使用（probe/auto/selftest）。
    // 教训：曾两次把使用点写在声明之前，触发 const 的暂时性死区（TDZ）错误，
    //       表现为整页白屏、自检不返回，且错误被 catch 吞掉难以定位。
    const params = new URLSearchParams(location.search);

    buildBoard(); buildPanel(); buildResult(); buildPromo(); buildDrawDlg();
    G.st = CHESS_RULES.parseFen(START_FEN);
    // 开局快照必须在建完 UI、解析完初始局面之后写入（makeStartSnapshot 要读 G.st 的 FEN）
    G.history = [makeStartSnapshot()];
    G.review = null;
    // ?style=disc|glyph 直接指定初始棋子样式（用于自动化截图对照，不影响正常游玩）
    // 注意：样式切换按钮已随 v1.6 复盘改版删除（Lua 侧 v1.3 起也不再提供），
    // 这里只保留 URL 参数供自动化截图对照，页面上不再有对应控件。
    const styleParam = params.get("style");
    if (styleParam === "disc" || styleParam === "glyph") {
      G.pieceStyle = styleParam;
    }
    G.uiReady = true;
    applyPanelMode();
    renderAll();
    setBoardInput(true);
    initNet();
    fitStage();
    window.addEventListener("resize", fitStage);
    requestAnimationFrame(tick);
    installMeasure();
    installSelfTest();
    installDebug();
    // 几何探针（?probe=1）：上报 viewport/stage/棋盘/面板 的真实几何，供自动化核对
    if (params.has("probe")) {
      setTimeout(() => {
        const rp = params.get("reportPort");
        const stageEl = document.getElementById("stage");
        const vp = document.getElementById("viewport");
        const g = (el) => { const r = el.getBoundingClientRect(); return { x: Math.round(r.left), y: Math.round(r.top), w: Math.round(r.width), h: Math.round(r.height), right: Math.round(r.right), bottom: Math.round(r.bottom) }; };
        const info = {
          viewport: { w: window.innerWidth, h: window.innerHeight },
          innerDocW: document.documentElement.clientWidth,
          innerDocH: document.documentElement.clientHeight,
          devicePixelRatio: window.devicePixelRatio,
          scaleNow: scaleNow,
          stageRect: g(stageEl),
          viewportRect: g(vp),
          boardSq0: g(UI.squares[0]),
          boardSq63: g(UI.squares[63]),
          panelBg: g(UI.panel.bg),
          btnLocal: g(UI.panel.btnLocal),
          stageTransform: stageEl.style.transform,
          bodyOverflow: getComputedStyle(document.body).overflow,
        };
        console.log("PROBE_RESULT " + JSON.stringify(info));
        if (rp) {
          try {
            fetch("http://127.0.0.1:" + rp + "/probe", {
              method: "POST", headers: { "Content-Type": "application/json" },
              body: JSON.stringify(info),
            }).catch(() => {});
          } catch (e) {}
        }
      }, 700);
    }

    // 自检模式：跑完把结果写进 title，并把结果 POST 回本地服务（供自动化读取）

    // 自动化验证用：?auto=[12,28] 依次点击这些格号（不影响正常打开）
    // 【教训】params 必须先声明再使用：此前 auto 段写在 params 声明之前，
    // 触发 const 的暂时性死区（TDZ）错误，被 catch 吞掉，导致序列根本没执行。
    const autoParam = params.get("auto");
    if (autoParam) {
      try {
        const seq = JSON.parse(decodeURIComponent(autoParam));
        setTimeout(() => {
          for (const sq of seq) {
            onSquareClicked(sq);
          }
        }, 500);
      } catch (e) { console.log("AUTO_SEQ_ERROR " + e.message); }
    }
    if (params.has("selftest")) {
      setTimeout(() => {
        const result = window.__selfTest();
        document.title = result.ok ? "SELFTEST_PASS" : "SELFTEST_FAIL";
        console.log("SELFTEST_RESULT " + JSON.stringify(result));
        const port = params.get("reportPort");
        if (port) {
          try {
            fetch("http://127.0.0.1:" + port + "/report", {
              method: "POST", headers: { "Content-Type": "application/json" },
              body: JSON.stringify(result),
            }).catch(() => {});
          } catch (e) {}
        }
      }, 600);
    }
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", boot);
  } else {
    boot();
  }
})();
</script>
