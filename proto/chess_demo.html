        for (let i = 0; i < 480; i++) tickClock(0.25);
        clockOk = (G.clockWhite === cw0) && (G.clockBlack === cb0);
        clockDetail = "w " + cw0 + "→" + G.clockWhite + " b " + cb0 + "→" + G.clockBlack;
      }
      add("review_no_clock_in_review", clockOk, clockDetail);

      // 退出复盘回到原局面（对局中看历史不改变局面）
      exitReview();
      add("review_exit_restores_board", G.review === null && CHESS_RULES.fenOf(G.st) === lastSnap.fen);

      // 空态：一步没走时进复盘应被拒绝并给提示
      newGame({ fromRemote: true });
      const emptyEntered = enterReview();
      add("review_empty_rejected", emptyEntered === false && G.review === null
          && UI.hint.textContent === TEXT.REVIEW_EMPTY, "hint=" + UI.hint.textContent);

      // 复位到干净开局
      newGame({ fromRemote: true });

      // ======================================================================
      // ===== v2.0 自检（初始界面 / 走时档 / 待机室 / 悔棋 / 复盘研习）=====
      // ----------------------------------------------------------------------
      // 【口径纪律】本区断言**一律不依赖真实渲染度量**：
      //   不读 getBoundingClientRect（浏览器里有值、Node shim 里全 0，两边结果不一致），
      //   不读 computedStyle（浅色主题下 color 的序列化方式各浏览器不同）。
      //   只断言四类东西：① 状态机字段 ② 数据表数值 ③ DOM 存在性 ④ 文本内容逐字。
      //   理由：本 Demo 的观感只能由用户打开浏览器确认（见 proto/_v2_notes.md 的
      //   「browser-run: user」），自检的作用是守住「逻辑与文案没有回归」，
      //   而不是冒充「画面已经验过」。
      // 【可重入】本区会改 G.screen / G.presetIdx 等状态，末尾**统一复位**到
      //   初始界面 + 默认档，保证连跑两次结果一致、也保证用户手动 ?selftest 之后
      //   页面停在合理的位置。
      // ======================================================================

      // --- V2-1 走时档数据表：4 档、首钟/加秒逐位正确、默认档 = 快棋 = 900+10 ---
      (function () {
        const want = [[60, 0], [180, 2], [900, 10], [5400, 30]];
        let ok = (V2_PRESETS.length === 4);
        const det = [];
        for (let i = 0; i < 4; i++) {
          const p = V2_PRESETS[i];
          if (!p) { ok = false; det.push("缺档" + i); continue; }
          if (p.clockSec !== want[i][0] || p.incSec !== want[i][1]) {
            ok = false;
            det.push("档" + i + "=" + p.clockSec + "+" + p.incSec + " 期望" + want[i][0] + "+" + want[i][1]);
          }
        }
        add("v2_preset_table_4", ok, det.join("; ") || "四档数值全部正确");
      })();

      // --- V2-2 默认档 = 快棋 = 900/10，且与 v1 的 INITIAL_TIME_SEC/INCREMENT_SEC 恒等 ---
      // 这条是「零回归」的机器证明：默认档改了，v1 的两条棋钟自检就会跟着变，
      // 而这里显式把两者的相等关系钉住，让「改了默认档却没改 v1 常量」立刻变红。
      (function () {
        const d = V2_PRESETS[V2_DEFAULT_PRESET];
        const ok = !!d && d.clockSec === INITIAL_TIME_SEC && d.incSec === INCREMENT_SEC
          && d.clockSec === 900 && d.incSec === 10;
        add("v2_default_preset_is_rapid_900_10", ok,
            "默认档=" + (d ? d.name + " " + d.clockSec + "+" + d.incSec : "无") +
            " v1常量=" + INITIAL_TIME_SEC + "+" + INCREMENT_SEC);
      })();

      // --- V2-3 切换档位真的驱动棋钟（不是只换界面文字）---
      // 【这是 Lead 指定的核心验收判据】点档位 1 → 棋钟初值 60；点档位 4 → 5400。
      // 断言的是 G.clockWhite / G.clockBlack，不是卡片上的字。
      (function () {
        const savedIdx = G.presetIdx;
        const savedEntry = G.entry;
        let ok = true; const det = [];
        for (let i = 0; i < V2_PRESETS.length; i++) {
          // onPresetPicked 在非联机入口下不受锁定限制
          G.entry = 1;
          const picked = onPresetPicked(i);
          if (!picked) { ok = false; det.push("档" + i + "选不中"); continue; }
          startPlaying();          // 真正开局，读棋钟初值
          const wantSec = V2_PRESETS[i].clockSec;
          if (G.clockWhite !== wantSec || G.clockBlack !== wantSec) {
            ok = false;
            det.push("档" + i + " 棋钟=" + G.clockWhite + "/" + G.clockBlack + " 期望" + wantSec);
          }
        }
        G.presetIdx = savedIdx; G.entry = savedEntry;
        add("v2_preset_drives_clock", ok, det.join("; ") ||
            "四档分别驱动出 " + V2_PRESETS.map(p => p.clockSec).join("/") + " 秒");
      })();

      // --- V2-4 每步加秒也真的按档位走（超快棋 0 加秒 / 慢棋 30 加秒）---
      (function () {
        const savedIdx = G.presetIdx, savedEntry = G.entry;
        G.entry = 1;
        let ok = true; const det = [];
        for (const i of [0, 3]) {
          onPresetPicked(i);
          startPlaying();
          G.peerAlive = false; G.mySide = 1;
          const before = G.clockWhite;
          selectSquare(12); tryMove(28);            // e2→e4（白方走子）
          const delta = G.clockWhite - before;
          // 棋钟在这段逻辑里不走（tick 没跑），所以 delta 应当精确等于加秒数
          if (delta !== V2_PRESETS[i].incSec) {
            ok = false;
            det.push("档" + i + " 加秒=" + delta + " 期望" + V2_PRESETS[i].incSec);
          }
        }
        G.presetIdx = savedIdx; G.entry = savedEntry;
        add("v2_preset_drives_increment", ok, det.join("; ") || "加秒随档位变化正确");
      })();

      // --- V2-5 初始界面：标题、4 张卡、3 个入口、全部文案逐字 ---
      (function () {
        let ok = true; const det = [];
        if (UI.start.title.textContent !== "国际象棋") { ok = false; det.push("标题=[" + UI.start.title.textContent + "]"); }
        if (UI.start.cards.length !== 4) { ok = false; det.push("卡数=" + UI.start.cards.length); }
        // 卡上档位名逐字（不带 1+0 这种数字写法）
        const wantNames = ["超快棋", "闪电战", "快棋", "慢棋"];
        for (let i = 0; i < 4; i++) {
          const got = UI.start.cards[i] ? UI.start.cards[i].nameEl.textContent : "<无>";
          if (got !== wantNames[i]) { ok = false; det.push("卡" + (i + 1) + "名=[" + got + "]"); }
        }
        // 卡上三行带标签
        if (UI.start.cards[2].firstEl.textContent !== "首钟：15 分钟") {
          ok = false; det.push("首钟行=[" + UI.start.cards[2].firstEl.textContent + "]");
        }
        if (UI.start.cards[2].incEl.textContent !== "加秒：每步 +10 秒") {
          ok = false; det.push("加秒行=[" + UI.start.cards[2].incEl.textContent + "]");
        }
        if (UI.start.cards[0].estEl.textContent !== "单局：约 1–3 分钟") {
          ok = false; det.push("预估行=[" + UI.start.cards[0].estEl.textContent + "]");
        }
        // 三个入口逐字
        const wantEntries = ["单人·双人同屏", "单人·复盘研习", "联机·待机室"];
        for (let i = 0; i < 3; i++) {
          const got = UI.start.entryBtns[i] ? UI.start.entryBtns[i].textContent : "<无>";
          if (got !== wantEntries[i]) { ok = false; det.push("入口" + (i + 1) + "=[" + got + "]"); }
        }
        add("v2_start_screen_texts", ok, det.join("; ") || "标题/4卡/3入口文案逐字正确");
      })();

      // --- V2-6 初始界面默认可见、棋盘默认锁定（启动屏就是 start）---
      (function () {
        // 先回到 start（本轮自检可能已经把页面开到别的屏）
        setScreen("start");
        const startShown = !UI.start.scr.classList.contains("hidden");
        const lobbyHidden = UI.lobby.scr.classList.contains("hidden");
        const labHidden = UI.lab.bar.classList.contains("hidden");
        // 棋盘命中区必须被锁：读的是 style.pointerEvents（纯数据，不依赖渲染）
        const boardLocked = UI.hitAreas.every(el => el.style.pointerEvents === "none");
        add("v2_start_screen_default_and_board_locked",
            startShown && lobbyHidden && labHidden && boardLocked && G.screen === "start",
            "start=" + startShown + " lobby隐=" + lobbyHidden + " lab隐=" + labHidden +
            " 棋盘锁=" + boardLocked + " screen=" + G.screen);
      })();

      // --- V2-7 档位卡选中态：只有一张带 is-sel，且它 == G.presetIdx ---
      (function () {
        const savedIdx = G.presetIdx;
        G.entry = 1;
        onPresetPicked(1);
        let selCount = 0, selIdx = -1;
        for (let i = 0; i < UI.start.cards.length; i++) {
          if (UI.start.cards[i].bg.classList.contains("is-sel")) { selCount++; selIdx = i; }
        }
        const ok = (selCount === 1 && selIdx === 1 && G.presetIdx === 1);
        G.presetIdx = savedIdx; syncPresetCards();
        add("v2_preset_card_selected_state", ok,
            "选中卡数=" + selCount + " 选中索引=" + selIdx + " presetIdx=" + G.presetIdx);
      })();

      // --- V2-8 联机锁定：「先选者生效」，后选者点击被忽略 ---
      (function () {
        const savedIdx = G.presetIdx, savedEntry = G.entry, savedLock = G.presetLockedBy;
        G.entry = 3; G.presetLockedBy = 0;
        const first = onPresetPicked(1);              // 先选者锁闪电战
        G.presetLockedBy = 1;                          // 模拟信号回来：先选的是「我」
        const second = onPresetPicked(3);              // 后选者想改慢棋 → 必须被拒
        // 【文案 P0/D-3】锁定行里填的是「你」/「对手」，不再是「玩家1/2」
        const ok = first === true && second === false && G.presetIdx === 1
          && UI.start.lockTip.textContent === "由 你 选定";
        const det = "first=" + first + " second=" + second + " idx=" + G.presetIdx +
          " tip=[" + UI.start.lockTip.textContent + "]";
        G.presetIdx = savedIdx; G.entry = savedEntry; G.presetLockedBy = savedLock;
        syncPresetCards(); renderLockTip();
        add("v2_preset_first_picker_wins", ok, det);
      })();

      // --- V2-9 待机室：单人兜底能开局 + 双人准备 → 3 秒倒数 → 自动开局 ---
      (function () {
        const savedEntry = G.entry, savedIdx = G.presetIdx;
        // ① 单人（无第二人）：点「直接开始」必须能进棋盘，不能卡死
        G.entry = 3; G.lobbyHasPeer = false;
        G.lobbyReady = [false, false]; G.lobbyCountdown = 0;
        setScreen("lobby"); renderLobby();
        const lazyTip = UI.lobby.tip.textContent;
        onLobbyStartNow();
        const soloOk = (G.screen === "playing");
        // ② 双人：两人都准备 → 倒数 3 秒 → 喂 dt 推完 → 自动进 playing
        G.entry = 3; G.lobbyHasPeer = true;
        G.lobbyReady = [false, false]; G.lobbyCountdown = 0;
        setScreen("lobby"); renderLobby();
        onLobbyReadyToggle();          // 我点准备
        const halfReady = G.lobbyCountdown;   // 还没倒数
        G.lobbyReady[1] = true;        // 对方准备
        maybeStartCountdown();
        const started = G.lobbyCountdown;
        // 用真实主循环的同一个函数推进 3 秒（不依赖真实时间流逝）
        for (let i = 0; i < 40; i++) tickLobby(0.1);
        const bothOk = (started === V2_COUNTDOWN_SEC) && (G.screen === "playing");
        G.lobbyHasPeer = false; G.lobbyReady = [false, false]; G.lobbyCountdown = 0;
        G.entry = savedEntry; G.presetIdx = savedIdx;
        add("v2_lobby_solo_and_two_players", soloOk && bothOk && halfReady === 0,
            "单人开局=" + soloOk + " 半就绪倒数=" + halfReady + " 双人倒数=" + started +
            " 双人开局=" + (G.screen === "playing") + " 单人提示=[" + lazyTip + "]");
      })();

      // --- V2-10 待机室文案与准备态切换逐字（P0/D-3：你 / 对手 / 等待对手加入…）---
      (function () {
        const savedEntry = G.entry;
        // ① 有对手：两行名字必须是「你」「对手」（不是「玩家1/玩家2」）
        G.entry = 3; G.lobbyHasPeer = true;
        G.lobbyReady = [false, false]; G.lobbyCountdown = 0;
        setScreen("lobby"); renderLobby();
        const nameMe = UI.lobby.rows[0].nameEl.textContent;
        const namePeer = UI.lobby.rows[1].nameEl.textContent;
        const before = UI.lobby.btnReady.textContent;
        const p2Before = UI.lobby.rows[1].stEl.textContent;
        onLobbyReadyToggle();
        const after = UI.lobby.btnReady.textContent;
        const p1After = UI.lobby.rows[0].stEl.textContent;
        // ② 没有对手：第 2 行**名字位**直接写「等待对手加入…」，状态位留空。
        //    （只改标签不改空态会出病句「对手　（空位）」，这是 P0 的连带项。）
        G.lobbyHasPeer = false; G.lobbyReady = [false, false]; G.lobbyCountdown = 0;
        renderLobby();
        const emptyName = UI.lobby.rows[1].nameEl.textContent;
        const emptyState = UI.lobby.rows[1].stEl.textContent;
        const soloTip = UI.lobby.tip.textContent;
        // 【全角空格】名字与状态之间是 U+3000「　」，不是半角空格
        const stHasIdeographicSpace = p2Before.charCodeAt(0) === 0x3000;
        const ok = (nameMe === "你") && (namePeer === "对手")
          && (before === "准备") && (after === "取消准备")
          && (p2Before === "　未准备") && (p1After === "　已准备")
          && (emptyName === "等待对手加入…") && (emptyState === "")
          && (soloTip === "没等到另一位玩家，也可以直接开始")
          && stHasIdeographicSpace
          && (UI.lobby.title.textContent === "联机·待机室");
        G.lobbyHasPeer = false; G.lobbyReady = [false, false];
        G.entry = savedEntry;
        setScreen("start");
        add("v2_lobby_ready_texts", ok,
            "名字 " + nameMe + "/" + namePeer + " 按钮 " + before + "→" + after +
            " 对手行=[" + p2Before + "] 我=[" + p1After + "]" +
            " 无人时=[" + emptyName + "|" + emptyState + "] 提示=[" + soloTip + "]" +
            " 全角空格=" + stHasIdeographicSpace);
      })();

      // --- V2-10b 复盘两个入口必须是不同函数，且面板键绑的是研习版 ---
      // 【为什么这条要存在】Lead 点名要求：将来有人「整理代码」时很容易把
      // enterReview / enterReviewLab 合并回一个，那一刻 v1 的 4 条复盘自检
      // （review_prev_next / review_no_clock_in_review / review_exit_restores_board /
      //   review_empty_rejected）会**静默**失去意义 —— 它们验的是"只读回放"，
      // 合并后它们验的东西就不存在了，但断言本身仍然绿。
      // 这里直接钉住「两个引用不同」，合并即红。
      (function () {
        const distinct = (enterReview !== enterReviewLab);
        // enterReview 必须是"只读"的：调用后棋盘命中区仍然全锁
        const savedEntry = G.entry, savedIdx = G.presetIdx;
        G.entry = 1; onPresetPicked(V2_DEFAULT_PRESET); startPlaying();
        G.peerAlive = false; G.mySide = 1;
        selectSquare(12); tryMove(28);
        selectSquare(52); tryMove(36);
        const enteredReadOnly = enterReview();
        const lockedAfterPlain = UI.hitAreas.every(el => el.style.pointerEvents === "none");
        exitReview();
        // enterReviewLab 必须是"可试走"的：调用后棋盘命中区放开
        const enteredLab = enterReviewLab();
        const openAfterLab = UI.hitAreas.every(el => el.style.pointerEvents !== "none");
        exitReviewLab();
        G.entry = savedEntry; G.presetIdx = savedIdx;
        add("v2_review_entries_distinct",
            distinct && enteredReadOnly && lockedAfterPlain && enteredLab && openAfterLab,
            "两引用不同=" + distinct + " enterReview 锁棋盘=" + lockedAfterPlain +
            " enterReviewLab 开棋盘=" + openAfterLab);
      })();

      // --- V2-11 悔棋：成对撤回、双方各扣 1、次数递减到 0 置灰 ---
      (function () {
        const savedEntry = G.entry, savedIdx = G.presetIdx;
        G.entry = 1; onPresetPicked(V2_DEFAULT_PRESET); startPlaying();
        G.peerAlive = false; G.mySide = 1;
        // 走 2 个半步（白 e4 / 黑 e5）→ history 应有 3 项
        selectSquare(12); tryMove(28);
        selectSquare(52); tryMove(36);
        const histBefore = G.history.length;      // 3
        const fenBefore = CHESS_RULES.fenOf(G.st);
        const leftBefore = G.undoLeft.slice();
        const ok = undoApplyPair();
        const histAfter = G.history.length;
        // 成对撤回：history 3 → 1（回到开局快照），局面回开局，双方各扣 1
        const pairOk = (histAfter === histBefore - 2) && (G.undoLeft[0] === leftBefore[0] - 1)
          && (G.undoLeft[1] === leftBefore[1] - 1)
          && (CHESS_RULES.fenOf(G.st) === START_FEN);
        // 按钮文案同步为「悔棋（剩 2）」
        const btnTxt = UI.panel.btnUndo.textContent;
        // 次数用尽 → 置灰（is-disabled）且 undoCanUse 返回 false
        const leftAfterOnce = G.undoLeft.slice();
        G.undoLeft = [0, 0];
        syncUndoButton();
        const grayed = UI.panel.btnUndo.classList.contains("is-disabled");
        const canAfter = undoCanUse().ok;
        // 复位
        G.undoLeft = [V2_UNDO_PER_SIDE, V2_UNDO_PER_SIDE];
        syncUndoButton();
        G.entry = savedEntry; G.presetIdx = savedIdx;
        add("v2_undo_pair_and_limit",
            !!ok && pairOk && btnTxt === "悔棋（剩 2）" && grayed && !canAfter,
            "history " + histBefore + "→" + histAfter + " 次数" + leftBefore.join("/") + "→" +
            leftAfterOnce.join("/") + " 按钮=[" + btnTxt + "] 置灰=" + grayed +
            " 用尽可选=" + canAfter + " 局面回开局=" + (CHESS_RULES.fenOf(G.st) === START_FEN));
      })();

      // --- V2-12 悔棋四条边界：开局不可悔 / 终局不可悔 / 复盘不可悔 / 单步不可悔 ---
      (function () {
        const savedEntry = G.entry, savedIdx = G.presetIdx;
        G.entry = 1; onPresetPicked(V2_DEFAULT_PRESET); startPlaying();
        // ① 刚开局（history=1）
        const atStart = undoCanUse();
        // ② 只走一步（history=2，凑不齐一对）
        G.peerAlive = false; G.mySide = 1;
        selectSquare(12); tryMove(28);
        const oneMove = undoCanUse();
        const oneMoveBlocked = undoApplyPair() === false;
        // ③ 终局
        selectSquare(52); tryMove(36);          // 补到 2 步
        G.over = true;
        const atOver = undoCanUse();
        G.over = false;
        // ④ 复盘中
        G.history.length >= 3 && enterReview();
        const inReview = undoCanUse();
        exitReview();
        const ok = (!atStart.ok && atStart.msg === "刚开局，还没有能退的一步")
          && (!oneMove.ok && oneMove.msg === "刚开局，还没有能退的一步")
          && oneMoveBlocked
          && (!atOver.ok && atOver.msg === "对局已结束，不能再悔棋")
          && (!inReview.ok && inReview.msg === "复盘里不能悔棋，先退出复盘");
        G.entry = savedEntry; G.presetIdx = savedIdx;
        add("v2_undo_boundaries", ok,
            "开局=" + atStart.msg + " | 单步=" + oneMove.msg + " 且拒执行=" + oneMoveBlocked +
            " | 终局=" + atOver.msg + " | 复盘=" + inReview.msg);
      })();

      // --- V2-13 复盘研习：分支试走不污染主变 ---
      (function () {
        const savedEntry = G.entry, savedIdx = G.presetIdx;
        G.entry = 1; onPresetPicked(V2_DEFAULT_PRESET); startPlaying();
        G.peerAlive = false; G.mySide = 1;
        selectSquare(12); tryMove(28);      // e2→e4
        selectSquare(52); tryMove(36);      // e7→e5
        const histLen0 = G.history.length;
        const mainFen0 = G.history[G.history.length - 1].fen;
        const logLen0 = G.moveLog.length;
        // 进研习，回到开局（idx 0），在主变的开局局面上试走
        const entered = enterReviewLab();
        reviewGoto(0);
        syncReviewBar();
        const atStartText = UI.lab.progress.textContent;
        // 开局局面：白方 e2 兵可走 → 点 e2 再点 e4 试走
        const sel = selectSquare(12);
        const branched = tryBranchMove(28);
        const branchFen = G.reviewBranch ? G.reviewBranch.branchFen : "";
        // 主变必须**一个字节都没动**
        const mainIntact = (G.history.length === histLen0)
          && (G.history[G.history.length - 1].fen === mainFen0)
          && (G.moveLog.length === logLen0);
        // 分支局面确实与开局不同（真的走出去了）
        const moved = (branchFen !== "" && branchFen !== START_FEN);
        // 退回主变 → 分支清空 + 画面回到主变
        const backOk = onBackToMain() === true && G.reviewBranch === null;
        const reviewBarShown = !UI.lab.bar.classList.contains("hidden");
        exitReviewLab();
        G.entry = savedEntry; G.presetIdx = savedIdx;
        add("v2_review_branch_does_not_touch_main",
            entered && sel && branched && mainIntact && moved && backOk && reviewBarShown,
            "进研习=" + entered + " 试走成功=" + branched + " 主变完好=" + mainIntact +
            " 分支局面已变=" + moved + " 退回主变=" + backOk + " 动作条可见=" + reviewBarShown +
            " 开局行=[" + atStartText + "]");
      })();

      // --- V2-14 复盘研习：「从此局面开新局」历史清空、以该局面为起点 ---
      (function () {
        const savedEntry = G.entry, savedIdx = G.presetIdx;
        G.entry = 1; onPresetPicked(V2_DEFAULT_PRESET); startPlaying();
        G.peerAlive = false; G.mySide = 1;
        selectSquare(12); tryMove(28);
        selectSquare(52); tryMove(36);
        enterReviewLab();
        // 在主变第 1 步（白方已走完 e4）的局面下「从开局重下」→ 最干脆的可观察结果
        reviewGoto(1);
        syncReviewBar();
        const startFenAt1 = G.history[1].fen;
        const okNew = onBranchNewGame();
        const cleared = (G.history.length === 1);
        const startIsThatPos = (G.history[0].fen === startFenAt1)
          && (CHESS_RULES.fenOf(G.st) === startFenAt1);
        const backToPlay = (G.screen === "playing") && (G.review === null) && (G.over === false);
        const undoReset = (G.undoLeft[0] === V2_UNDO_PER_SIDE && G.undoLeft[1] === V2_UNDO_PER_SIDE);
        G.entry = savedEntry; G.presetIdx = savedIdx;
        add("v2_review_newgame_clears_history",
            okNew && cleared && startIsThatPos && backToPlay && undoReset,
            "清空=" + cleared + " 历史长=" + G.history.length + " 起点=该局面=" + startIsThatPos +
            " 回对局屏=" + backToPlay + " 悔棋次数复位=" + undoReset);
      })();

      // --- V2-15 屏幕状态机：三块屏互斥，且非对局屏不跑棋钟 ---
      (function () {
        const savedEntry = G.entry;
        G.entry = 1; startPlaying();
        const clock0W = G.clockWhite;
        // 把屏切到 start，喂 100 次 0.25s（=25 秒虚拟时间），棋钟必须纹丝不动
        setScreen("start");
        for (let i = 0; i < 100; i++) tickClock(0.25);
        const frozenOnStart = (G.clockWhite === clock0W);
        // 三块屏互斥：同一时刻只有一个屏幕层的 scr/bar 可见
        const visStart = !UI.start.scr.classList.contains("hidden");
        const visLobby = !UI.lobby.scr.classList.contains("hidden");
        const visibleCount = (visStart ? 1 : 0) + (visLobby ? 1 : 0);
        // 回到 playing 后棋钟应能继续走
        setScreen("playing");
        tickClock(1.0);
        const tickingAgain = (G.clockWhite === clock0W - 1.0);
        G.entry = savedEntry;
        add("v2_screen_machine_and_clock_gate",
            frozenOnStart && visibleCount === 1 && tickingAgain,
            "初始界面冻结棋钟=" + frozenOnStart + " 可见屏数=" + visibleCount +
            " 回对局继续走钟=" + tickingAgain);
      })();

      // --- V2-16 控件命名纪律：v2 新控件一律 v2 前缀，不许用 btn 前缀 ---
      // 【为什么这条要进自检】tools_work/consistency_check.cjs 有两道「未登记的按钮」断言：
      // 任何 `btn` 开头的按钮/命中区都必须登记进 BTN_PAIRS，否则整项 FAIL。
      // v2 新增 20+ 个按钮，靠人记一定会漏，机器守着最省事。
      (function () {
        const bad = [];
        const all = [];
        if (UI.start.parts) UI.start.parts.forEach(el => { if (el) all.push(el); });
        if (UI.lobby.parts) UI.lobby.parts.forEach(el => { if (el) all.push(el); });
        if (UI.lab.parts) all.push(UI.lab.bar);
        if (UI.lab.btns) for (const k in UI.lab.btns) { all.push(UI.lab.btns[k].btn); all.push(UI.lab.btns[k].hit); }
        for (const el of all) {
          const id = el.getAttribute ? el.getAttribute("data-anchor-id") : null;
          if (!id) { bad.push("(无 anchorId)"); continue; }
          if (!/^v2/.test(id)) bad.push(id);
        }
        add("v2_controls_use_v2_prefix", bad.length === 0,
            bad.length ? ("越界 anchorId: " + bad.join(",")) : ("共 " + all.length + " 个 v2 控件全部合规"));
      })();

      // --- V2-17 面板第三行中剖：两键不重叠、间隙 4%、悔棋键在右 ---
      // 【v2.0 宽度不再等宽】左「看历史/退出复盘」0.42、右「悔棋（剩 N）」0.46 ——
      // 右半文字明显更长（6 个全角宽 vs 3~4 字），等宽会让它差 1px 换行。
      // 所以这条**不再断言等宽**，改为断言：右半不窄于左半（文字更长的那半必须更宽）
      // + 两键总宽不溢出面板右端。
      (function () {
        function lr(el) {
          return { l: parseFloat(el.style.left), w: parseFloat(el.style.width) };
        }
        const a = lr(UI.panel.btnReview), b = lr(UI.panel.btnUndo);
        const gap = b.l - (a.l + a.w);
        const rowRight = b.l + b.w;
        const panelRight = L.panelLeft + L.panelW;
        const ok = (gap > 0.5) && (Math.abs(gap - L.panelW * 0.04) < 0.5)
          && (b.w >= a.w - 0.5)                 // 右半不窄于左半
          && (b.l > a.l)                        // 右半确实在右边
          && (rowRight <= panelRight + 0.5)     // 不溢出面板
          && (UI.panel.btnUndo.textContent.indexOf("悔棋（剩 ") === 0);
        add("v2_panel_row3_split_no_overlap", ok,
            "左 l=" + a.l.toFixed(1) + " w=" + a.w.toFixed(1) +
            " 右 l=" + b.l.toFixed(1) + " w=" + b.w.toFixed(1) +
            " 间隙=" + gap.toFixed(2) + " 期望=" + (L.panelW * 0.04).toFixed(2) +
            " 行右端=" + rowRight.toFixed(1) + " 面板右端=" + panelRight.toFixed(1));
      })();

      // --- V2-18 三个硬约束的静态守卫（单文件离线 / stage 定位 / fontScale 取 min）---
      // 【口径】这三条只能守「写法」不能守「观感」：
      //   ① 离线：查 DOM 里有没有外链 script/link/img —— 纯 DOM 查询，不依赖渲染
      //   ② stage 定位：查 #stage 的 inline transform 里同时有 translate(-50% 与 scale(
      //   ③ fontScale：查 L.fontScale 与 Math.min 表达式的一致性（用真实计算值反推）
      (function () {
        let ok = true; const det = [];
        // ① 无外部脚本/样式/图片
        const ext = document.querySelectorAll('script[src], link[rel="stylesheet"], img[src]');
        const extN = ext ? ext.length : 0;
        if (extN !== 0) { ok = false; det.push("外链元素=" + extN); }
        // ② stage 的 transform 写法
        const tf = document.getElementById("stage").style.transform || "";
        const hasTranslate = tf.indexOf("translate(-50%") >= 0;
        const hasScale = tf.indexOf("scale(") >= 0;
        if (!hasTranslate || !hasScale) { ok = false; det.push("stage transform=[" + tf + "]"); }
        // ③ fontScale = min(canvasW/BASE_W, canvasH/BASE_H)：用 4:3 反推验证
        //    1600×900 → 1.0；1280×960（4:3）→ min(0.8, 1.0667) = 0.8（只按高度会得 1.067 → 历史 bug）
        const l169 = computeLayout(1600, 900);
        const l43 = computeLayout(1280, 960);
        const fs169Ok = Math.abs(l169.fontScale - 1.0) < 1e-9;
        const fs43Ok = Math.abs(l43.fontScale - 0.8) < 1e-9;
        if (!fs169Ok || !fs43Ok) {
          ok = false;
          det.push("fontScale 16:9=" + l169.fontScale + " 4:3=" + l43.fontScale + "（4:3 应为 0.8）");
        }
        add("v2_hard_constraints_offline_stage_fontscale", ok,
            det.join("; ") || ("无外链 / stage transform=[" + tf + "] / fontScale 16:9=" +
              l169.fontScale.toFixed(3) + " 4:3=" + l43.fontScale.toFixed(3)));
      })();

      // --- V2-19 新增文案键无空缺（防止 .replace 里 {n}/{m}/{who} 模板被误删）---
      // 【含 P0/D-3 的 6 个 LOBBY_* 规范键】旧键名（PLAYER_1/PLAYER_2/PLAYER_EMPTY/
      // READY_YES/READY_NO/LOBBY_WAIT_JOIN）已作废，这里同时断言它们**不再存在**，
      // 防止有人照旧文档把旧键加回来（那样界面会显示 undefined）。
      (function () {
        const need = ["BTN_UNDO", "CONFIRM_UNDO", "TC_LOCKED_BY", "REVIEW_PROGRESS",
                      "START_TITLE", "ENTRY_1", "ENTRY_2", "ENTRY_3",
                      // P0/D-3 六个规范键
                      "LOBBY_ME", "LOBBY_OPP", "LOBBY_SLOT_EMPTY",
                      "LOBBY_READY_ON", "LOBBY_READY_OFF", "LOBBY_NOBODY",
                      "BTN_READY", "BTN_UNREADY", "BTN_START_NOW",
                      "BTN_BACK_TO_MAIN", "BTN_BRANCH_NEWGAME"];
        const missing = need.filter(k => typeof TEXT_V2[k] !== "string" || TEXT_V2[k] === "");
        // 旧键名必须不存在（除了注释里提到它们，TEXT_V2 表里不许有真键）
        const obsolete = ["PLAYER_1", "PLAYER_2", "PLAYER_EMPTY",
                          "READY_YES", "READY_NO", "LOBBY_WAIT_JOIN"];
        const revived = obsolete.filter(k => typeof TEXT_V2[k] === "string");
        // 模板占位符必须在（否则 replace 后仍是原文，界面会出现 {n} 字样）
        const tplOk = TEXT_V2.BTN_UNDO.indexOf("{n}") >= 0
          && TEXT_V2.TC_LOCKED_BY.indexOf("{who}") >= 0
          && TEXT_V2.REVIEW_PROGRESS.indexOf("{n}") >= 0
          && TEXT_V2.REVIEW_PROGRESS.indexOf("{m}") >= 0;
        // P0 逐字抽查（这两个是本次的核心决策，字错一个就是决策没落地）
        const p0Ok = TEXT_V2.LOBBY_ME === "你" && TEXT_V2.LOBBY_OPP === "对手"
          && TEXT_V2.LOBBY_SLOT_EMPTY === "等待对手加入…"
          && TEXT_V2.LOBBY_TITLE === "联机·待机室";
        // 省略号必须是单字符 U+2026，不是三个半角点
        const ellOk = TEXT_V2.LOBBY_SLOT_EMPTY.indexOf("\u2026") >= 0
          && TEXT_V2.LOBBY_SLOT_EMPTY.indexOf("...") < 0;
        // FOOT_TIP ≤ 20 汉字（Lead：21 字是真的会被截断）
        const han = (TEXT_V2.FOOT_TIP.match(/[\u4e00-\u9fff]/g) || []).length;
        const footOk = han <= 20;
        add("v2_text_keys_present",
            missing.length === 0 && tplOk && revived.length === 0 && p0Ok && ellOk && footOk,
            "缺键=" + (missing.join(",") || "无") + " 模板占位=" + tplOk +
            " 旧键复活=" + (revived.join(",") || "无") + " P0逐字=" + p0Ok +
            " 单字符省略号=" + ellOk + " FOOT_TIP汉字=" + han + "/20");
      })();

      // --- V2-19b 板高 ≥ 2.1 × 字号（本项目已踩三次的"整行被吞"硬规则）---
      // 【为什么是 2.1】行高 1.2× + 上下内边距 0.9×。违反的后果**不是截断，
      // 而是整行被吞掉、什么都不显示、也不报错** —— 本项目已踩三次：
      //   ① v1.10 结算面板标题  ② v2.0 块 1 的档位名  ③ gdd §5.6 倒数数字 72。
      // 【口径】读 fontSize 与 style.height 两个纯内联数值，
      // 不依赖 getBoundingClientRect —— 那个在 Node shim 里全是 0，浏览器里有值，两边结论不一致。
      // 【v2.0 补：把 v1 面板按钮也纳进来】初版只遍历 UI.start/lobby/lab/undoDlg 四组，
      // 漏掉了 v1 的面板按钮（尤其第三行被中剖成半宽的「退出复盘」/「悔棋（剩 N）」）。
      // 那正是我上一轮自己指出的断言盲区 —— 现在补上 panel 这组。
      (function () {
        const els = [];
        const collect = (parts) => { if (parts) parts.forEach(el => { if (el) els.push(el); }); };
        collect(UI.start.parts); collect(UI.lobby.parts); collect(UI.lab.parts);
        collect(UI.undoDlg.parts);
        // 【补盲区】v1 面板的按钮与文字：normalParts / reviewParts 两组 + 第三行两键 + 提示条。
        // 注意 normalParts/reviewParts 是**互斥显隐**的，但断言要看的是几何不是可见性，
        // 所以两组都收进来（同时隐藏的两个不会被"跳过"逻辑吃掉，因为它们都有文字）。
        collect(UI.panel.normalParts); collect(UI.panel.reviewParts);
        collect([UI.panel.btnReview, UI.panel.btnUndo, UI.hint]);
        const bad = [];
        let checked = 0, skipped = 0;
        for (const el of els) {
          const txt = el.textContent;
          if (!txt || txt.trim() === "") { skipped++; continue; }
          const fsPx = parseFloat(el.style.fontSize);
          const hPx = parseFloat(el.style.height);
          if (!isFinite(fsPx) || !isFinite(hPx) || fsPx <= 0) { skipped++; continue; }
          checked++;
          const need = 2.1 * fsPx;
          if (hPx + 0.01 < need) {
            const id = el.getAttribute ? el.getAttribute("data-anchor-id") : "?";
            bad.push(id + " h=" + hPx.toFixed(1) + " 字号=" + fsPx.toFixed(1) +
                     " 需≥" + need.toFixed(1) + " 文=[" + txt.slice(0, 12) + "]");
          }
        }
        add("v2_text_box_height_ge_2_1x_font", bad.length === 0,
            "检查 " + checked + " 个文本元素（含 v1 面板按钮），跳过 " + (skipped) + " 个（无文字）" +
            (bad.length ? ("；违规: " + bad.join(" | ")) : "；全部满足 板高 ≥ 2.1×字号"));
      })();

      // --- V2-19c 文字宽度不得超出容器（补「退出复盘」半宽盲区）---
      // 【为什么必须单独一条】高度够 ≠ 放得下。面板第三行被中剖成半宽后，
      // `退出复盘`（4 汉字）/ `悔棋（剩 3）`（约 6 全角宽）在半宽里会不会换行是纯宽度问题，
      // 2.1×字号那条完全管不到它。我上一轮明确说过这是唯一漏网处，这里补上。
      //
      // 【字宽估算口径】不测真实渲染（Node shim 没有字体度量），用保守的经验值：
      //   全角字符（CJK / 全角标点 / 全角括号）= 1.00 × 字号
      //   其余（ASCII 数字字母空格）= 0.55 × 字号
      // 这是**上界估计**：真机上 Microsoft YaHei / PingFang 的汉字宽约 1.0em，
      // 数字约 0.5em，所以估出来偏宽 —— 宁可保守也不放过。
      // 判定用 boxW × 0.94（预留左右各 3% 内边距），与 .v2btn 的实际排版留白同量级。
      (function () {
        const isWide = (ch) => {
          const c = ch.codePointAt(0);
          return (c >= 0x4E00 && c <= 0x9FFF)     // CJK 统一表意
              || (c >= 0x3000 && c <= 0x303F)     // CJK 标点（含 、。「」）
              || (c >= 0xFF00 && c <= 0xFFEF)     // 全角形式（含 （） ：）
              || (c >= 0x2010 && c <= 0x2027)     // 破折号/间隔号/省略号区
              || c === 0x00B7;                    // 间隔号 ·
        };
        const estWidth = (txt, fsPx) => {
          let w = 0;
          for (const ch of txt) w += (isWide(ch) ? 1.0 : 0.55) * fsPx;
          return w;
        };
        // 待检：所有 v2 按钮 + v1 面板按钮（它们都是"文字固定在框里"的控件）
        const boxes = [];
        const add_ = (el, label) => { if (el) boxes.push([el, label]); };
        // 入口三键
        (UI.start.entryBtns || []).forEach((el, i) => add_(el, "v2entry" + (i + 1)));
        // 待机室按钮
        add_(UI.lobby.btnReady, "v2btnready");
        add_(UI.lobby.btnStart, "v2btnstartnow");
        add_(UI.lobby.btnBack, "v2lobbyleave");
        // 复盘动作条六键
        if (UI.lab.btns) for (const k in UI.lab.btns) add_(UI.lab.btns[k].btn, "v2rev" + k);
        // 悔棋弹窗两键
        add_(UI.undoDlg.btnYes, "v2undoyes");
        add_(UI.undoDlg.btnNo, "v2undono");
        // v1 面板：第三行中剖的两键（**盲区就在这**）+ 正常/复盘两组的按钮
        add_(UI.panel.btnReview, "btnreview");
        add_(UI.panel.btnUndo, "v2undo");
        (UI.panel.normalParts || []).forEach((el) => {
          if (el && el.classList && el.classList.contains("btn")) {
            add_(el, el.getAttribute ? el.getAttribute("data-anchor-id") : "panelBtn");
          }
        });
        (UI.panel.reviewParts || []).forEach((el) => {
          if (el && el.classList && el.classList.contains("btn")) {
            add_(el, el.getAttribute ? el.getAttribute("data-anchor-id") : "panelBtn");
          }
        });
        const bad = [];
        let checked = 0;
        for (const [el, label] of boxes) {
          const txt = el.textContent;
          if (!txt || txt.trim() === "") continue;
          const fsPx = parseFloat(el.style.fontSize);
          const boxW = parseFloat(el.style.width);
          if (!isFinite(fsPx) || !isFinite(boxW) || fsPx <= 0) continue;
          checked++;
          const need = estWidth(txt, fsPx);
          const avail = boxW * 0.94;
          if (need > avail + 0.01) {
            bad.push(label + " 需宽" + need.toFixed(0) + " 可用" + avail.toFixed(0) +
                     " 字号" + fsPx.toFixed(0) + " 文=[" + txt + "]");
          }
        }
        add("v2_text_width_fits_box", bad.length === 0,
            "检查 " + checked + " 个按钮文字（含面板第三行中剖的两键）" +
            (bad.length ? ("；溢出: " + bad.join(" | ")) : "；全部放得下"));
      })();

      // --- V2-20 悔棋按钮文案四档逐字（剩 3 / 2 / 1 / 0）---
      (function () {
        const saved = G.undoLeft.slice();
        const want = ["悔棋（剩 3）", "悔棋（剩 2）", "悔棋（剩 1）", "悔棋（剩 0）"];
        let ok = true; const det = [];
        for (let n = 3; n >= 0; n--) {
          G.undoLeft = [n, n];
          syncUndoButton();
          const got = UI.panel.btnUndo.textContent;
          if (got !== want[3 - n]) { ok = false; det.push("剩" + n + "→[" + got + "]"); }
        }
        G.undoLeft = saved;
        syncUndoButton();
        add("v2_undo_button_texts", ok, det.join("; ") || "四档文案逐字正确（全角括号）");
      })();

      // ===== v2.0 自检结束：统一复位到「初始界面 + 默认档」=====
      // 【必须复位】上面 20 条断言大量改 G.screen / G.presetIdx / G.undoLeft / history，
      // 若不复位，用户手动打开 ?selftest=1 后会停在一副奇怪的局面上。
      (function () {
        G.entry = 1;
        G.presetIdx = V2_DEFAULT_PRESET;
        G.presetLockedBy = 0;
        G.lobbyHasPeer = false;
        G.lobbyReady = [false, false];
        G.lobbyCountdown = 0;
        G.undoLeft = [V2_UNDO_PER_SIDE, V2_UNDO_PER_SIDE];
        G.undoPendingFrom = -1;
        G.peerAlive = false;
        G.mySide = 1;
        G.review = null;
        G.reviewBranch = null;
        G.over = false;
        G.clockWhite = INITIAL_TIME_SEC; G.clockBlack = INITIAL_TIME_SEC;
        setLegalHintColor(false);
        G.st = CHESS_RULES.parseFen(START_FEN);
        G.history = [makeStartSnapshot()];
        G.moveLog = []; G.capturedWhite = []; G.capturedBlack = [];
        G.lastFrom = -1; G.lastTo = -1;
        clearHighlights();
        hideResult();
        syncPresetCards();
        renderLockTip();
        applyPanelMode();
        renderAll();
        syncUndoButton();
        G.entry = 1;
        setScreen("start");
      })();

      const ok = checks.every(c => c.pass);
      return { ok, checks };
    };
  }

  // ---------- 调试层（?debug=1） ----------
  function installDebug() {
    const params = new URLSearchParams(location.search);
    if (!params.has("debug")) return;
    const layer = document.getElementById("debugLayer");
    layer.classList.add("on");
    document.querySelectorAll("[data-anchor-id]").forEach((el) => {
      const r = el.getBoundingClientRect();
      const s = document.getElementById("stage").getBoundingClientRect();
      const scale = s.width / BASE_W;
      const box = document.createElement("div");
      box.className = "anchor-line";
      box.style.left = ((r.left - s.left) / scale) + "px";
      box.style.bottom = ((s.bottom - r.bottom) / scale) + "px";
      box.style.width = (r.width / scale) + "px";
      box.style.height = (r.height / scale) + "px";
      layer.appendChild(box);
    });
  }

  // ---------- 启动 ----------
  function boot() {
    // 【必须放在最前】params 被后面多处使用（probe/auto/selftest）。
    // 教训：曾两次把使用点写在声明之前，触发 const 的暂时性死区（TDZ）错误，
    //       表现为整页白屏、自检不返回，且错误被 catch 吞掉难以定位。
    const params = new URLSearchParams(location.search);

    buildBoard(); buildPanel(); buildResult(); buildPromo(); buildDrawDlg();
    // v2.0 三块新界面 + 悔棋确认框。**必须在这四行之后建**：
    // 屏幕层要压在最上面（同级后出现的在上），弹窗又要压在屏幕层上面，
    // 所以顺序是 面板/棋盘 → 结算/升变/求和 → v2 屏 → v2 悔棋框。
    buildV2Start(); buildV2Lobby(); buildV2ReviewBar(); buildV2UndoDlg();
    G.st = CHESS_RULES.parseFen(START_FEN);
    // 开局快照必须在建完 UI、解析完初始局面之后写入（makeStartSnapshot 要读 G.st 的 FEN）
    G.history = [makeStartSnapshot()];
    G.review = null;
    // 【已删除 ?style=disc|glyph】棋子只剩「图元拟合」一种画法（issue #1 第 4 条），
    // 没有第二档可切。旧链接带这个参数不会报错，只是被忽略。
    G.uiReady = true;
    applyPanelMode();
    syncPresetCards();
    renderLockTip();
    renderAll();
    // 【v2.0 启动屏】默认进初始界面，不是直接进棋盘。
    // setScreen 会一并处理：屏幕层显隐、棋盘锁定、面板命中区开关。
    // 【顺序】**必须在 renderAll() 之后**：renderAll 会重绘棋子并清高亮，
    // 若先 setScreen 再 renderAll，屏幕层虽然可见但棋盘底层刚被动过，无害；
    // 反过来则会因为 setScreen 里 setBoardInput(true) 把初始界面的锁解掉。
    setScreen("start");
    // ?screen=playing 直接进棋盘（调试/自动化用；默认不传 = 初始界面）
    if (params.get("screen") === "playing") {
      G.entry = 1; G.localMode = true; startPlaying();
    } else if (params.get("screen") === "lobby") {
      G.entry = 3; setScreen("lobby"); renderLobby();
    }
    initNet();
    fitStage();
    window.addEventListener("resize", fitStage);
    requestAnimationFrame(tick);
    installMeasure();
    installSelfTest();
    installDebug();
    // 几何探针（?probe=1）：上报 viewport/stage/棋盘/面板 的真实几何，供自动化核对
    if (params.has("probe")) {
      setTimeout(() => {
        const rp = params.get("reportPort");
        const stageEl = document.getElementById("stage");
        const vp = document.getElementById("viewport");
        const g = (el) => { const r = el.getBoundingClientRect(); return { x: Math.round(r.left), y: Math.round(r.top), w: Math.round(r.width), h: Math.round(r.height), right: Math.round(r.right), bottom: Math.round(r.bottom) }; };
        const info = {
          viewport: { w: window.innerWidth, h: window.innerHeight },
          innerDocW: document.documentElement.clientWidth,
          innerDocH: document.documentElement.clientHeight,
          devicePixelRatio: window.devicePixelRatio,
          scaleNow: scaleNow,
          stageRect: g(stageEl),
          viewportRect: g(vp),
          boardSq0: g(UI.squares[0]),
          boardSq63: g(UI.squares[63]),
          panelBg: g(UI.panel.bg),
          btnDraw: g(UI.panel.btnDraw),
          stageTransform: stageEl.style.transform,
          bodyOverflow: getComputedStyle(document.body).overflow,
        };
        console.log("PROBE_RESULT " + JSON.stringify(info));
        if (rp) {
          try {
            fetch("http://127.0.0.1:" + rp + "/probe", {
              method: "POST", headers: { "Content-Type": "application/json" },
              body: JSON.stringify(info),
            }).catch(() => {});
          } catch (e) {}
        }
      }, 700);
    }

    // 自检模式：跑完把结果写进 title，并把结果 POST 回本地服务（供自动化读取）

    // 自动化验证用：?auto=[12,28] 依次点击这些格号（不影响正常打开）
    // 【教训】params 必须先声明再使用：此前 auto 段写在 params 声明之前，
    // 触发 const 的暂时性死区（TDZ）错误，被 catch 吞掉，导致序列根本没执行。
    const autoParam = params.get("auto");
    if (autoParam) {
      try {
        const seq = JSON.parse(decodeURIComponent(autoParam));
        setTimeout(() => {
          for (const sq of seq) {
            onSquareClicked(sq);
          }
        }, 500);
      } catch (e) { console.log("AUTO_SEQ_ERROR " + e.message); }
    }
    if (params.has("selftest")) {
      setTimeout(() => {
        const result = window.__selfTest();
        document.title = result.ok ? "SELFTEST_PASS" : "SELFTEST_FAIL";
        console.log("SELFTEST_RESULT " + JSON.stringify(result));
        const port = params.get("reportPort");
        if (port) {
          try {
            fetch("http://127.0.0.1:" + port + "/report", {
              method: "POST", headers: { "Content-Type": "application/json" },
              body: JSON.stringify(result),
            }).catch(() => {});
          } catch (e) {}
        }
      }, 600);
    }
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", boot);
  } else {
    boot();
  }
})();
</script>
</body>
